<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Golf Club Pete</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#06130c;--card:#0d281b;--line:#1f4a34;--ink:#eef3ec;--mute:#9db3a5;--green:#1fa35a;--gold:#d9a441;--silver:#c3cbd1;--bronze:#c9743a;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 'Manrope',system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(6,19,12,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:28px;height:78px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);flex:none}
.brand img{width:62px;height:62px;object-fit:contain}
nav{display:flex;gap:26px;overflow-x:auto;flex:1;scrollbar-width:none}
nav a{color:var(--ink);text-decoration:none;font-size:14px;letter-spacing:.07em;text-transform:uppercase;padding:8px 0;border-bottom:2px solid transparent;white-space:nowrap}
nav a.on{border-color:var(--green)}
.tag{font-size:13px;color:var(--mute);line-height:1.3;display:flex;gap:10px;align-items:center;flex:none}
.tag svg{width:34px;height:34px}
@media(max-width:980px){.tag{display:none}}
@media(max-width:640px){header .wrap{gap:14px}.brand img{width:46px;height:46px}}
.hero{position:relative;min-height:340px;overflow:hidden}
.hero-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 54%}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,19,12,.72),rgba(6,19,12,.24) 60%,rgba(6,19,12,.08)),linear-gradient(0deg,var(--bg),transparent 45%)}
.hero .wrap{position:relative;z-index:1;padding-top:44px;padding-bottom:50px}
.hero small{display:block;font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
h1{font:800 clamp(46px,9vw,84px)/1.05 'Manrope',system-ui,sans-serif;letter-spacing:-.045em;margin:8px 0 10px}
.hero p{font-size:18px;font-weight:500;margin:0}
.page{padding:36px 0 10px}
.page h1{font-size:clamp(38px,6vw,56px)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:26px;margin-top:-14px;position:relative;z-index:2}
.stand-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px;margin-top:24px}
.stand-choice{position:relative;isolation:isolate;display:flex;align-items:flex-end;min-height:190px;padding:22px;border:1px solid var(--line);border-radius:12px;overflow:hidden;color:var(--ink);text-decoration:none;background:var(--card);transition:border-color .2s,transform .2s}
.stand-choice:hover{border-color:var(--green);transform:translateY(-2px)}
.stand-choice:after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(0deg,rgba(5,17,10,.88),rgba(5,17,10,.08) 90%)}
.stand-choice>.bg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;object-fit:cover;filter:brightness(.68) saturate(.82)}
.stand-choice span{position:relative;z-index:1;font:700 22px/1.2 'Manrope',system-ui,sans-serif;letter-spacing:-.02em}
.stand-choice b{margin-left:auto;font-size:22px}
.tile{position:relative;border-radius:14px;overflow:hidden;min-height:400px;border:1px solid var(--line);padding:26px 28px;display:flex;flex-direction:column}
.tile.live{border:2px solid var(--green);box-shadow:0 0 34px rgba(31,163,90,.28)}
.tile.open{border:2px solid var(--green);box-shadow:0 0 34px rgba(31,163,90,.28)}
.tile.soon{border-color:#555d58}
.tile.tournament{border-color:#546c70;box-shadow:0 0 30px rgba(81,123,133,.18)}
.tile>.bg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.tile>img.bg{object-fit:cover;object-position:center;filter:brightness(.7) saturate(.88)}
.tile.soon>img.bg{filter:grayscale(1) brightness(.65)}
.tile:after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(90deg,rgba(5,17,10,.48),rgba(5,17,10,.08) 95%),linear-gradient(0deg,rgba(5,17,10,.42),transparent 62%);pointer-events:none}
.tile.soon>svg.bg{filter:grayscale(1)}
.tile>*:not(.bg){position:relative;z-index:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:6px 16px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.pill.l{background:rgba(14,90,50,.85);border:1px solid var(--green)}
.pill.w{background:rgba(255,255,255,.88);color:#1b2a22}
.pill.o{border:1px solid rgba(255,255,255,.7);background:rgba(0,0,0,.25)}
.dot{width:10px;height:10px;border-radius:50%;background:#fff;animation:p 1.8s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}70%,100%{box-shadow:0 0 0 9px transparent}}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
.tile h2{font:700 clamp(32px,5vw,42px)/1.12 'Manrope',system-ui,sans-serif;letter-spacing:-.035em;margin:26px 0 12px;max-width:14ch}
.meta{font-size:14px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.tile p{max-width:34ch;margin:0 0 22px}
.btn{margin-top:auto;align-self:flex-start;display:inline-flex;gap:12px;padding:14px 26px;border-radius:99px;font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:#fff;background:#0f5a32;border:1px solid var(--green)}
.btn.off{background:rgba(120,125,122,.55);border-color:#999;color:#e8e8e8;cursor:default}
.back-to-stand{display:inline-flex;align-items:center;gap:9px;margin:0 0 18px;padding:10px 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font-size:14px;font-weight:600;text-decoration:none;transition:border-color .2s,background .2s}
.back-to-stand:hover{border-color:var(--green);background:#123523}
.sec{display:flex;align-items:center;gap:16px;margin:46px 0 18px}
.sec h3{margin:0;font:700 20px 'Manrope',system-ui,sans-serif;letter-spacing:.01em;text-transform:uppercase}
.sec small{display:block;color:var(--mute);font-size:13px}
.sec hr{flex:1;border:0;border-top:1px solid var(--line)}
.sec a{color:var(--ink);font-size:14px;text-decoration:none}
.podium{display:grid;gap:10px}
.pc{display:grid;grid-template-columns:56px minmax(0,1fr) repeat(3,minmax(110px,auto));align-items:center;gap:18px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 20px}
.pc.r1{border-color:#6b5524;background:linear-gradient(90deg,rgba(217,164,65,.1),var(--card) 34%)}
.pc.r3{border-color:#6b4023}
.medal{width:42px;height:42px;display:grid;place-items:center;flex:none}
.medal svg{width:34px;height:34px}
.medal.gold{color:#d9a441}.medal.silver{color:#c3cbd1}.medal.bronze{color:#c9743a}
.pc .who{min-width:0}.pc .who b{font:700 18px 'Manrope',system-ui,sans-serif;display:block}.pc .who span{color:var(--mute);font-size:13px}
.pc .num{border-left:1px solid var(--line);padding-left:18px;text-align:left}
.pc .num small{display:block;font-size:11px;color:var(--mute);letter-spacing:.05em;text-transform:uppercase}.pc .num b{font-weight:500;font-size:18px}
@media(max-width:760px){.pc{grid-template-columns:44px minmax(0,1fr) minmax(0,1fr);gap:10px 12px;padding:14px}.medal{grid-row:1 / span 3;width:38px;height:38px}.medal svg{width:32px;height:32px}.pc .who{grid-column:2 / 4;grid-row:1}.pc .num{padding-left:10px}.pc .num:nth-child(3){grid-column:2;grid-row:2}.pc .num:nth-child(4){grid-column:3;grid-row:2}.pc .num:nth-child(5){grid-column:2 / 4;grid-row:3}}
.scroll{overflow-x:auto}
.stand-summary{margin-top:36px;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow-x:auto}
.stand-summary table{border:0;background:transparent}
.round-table{min-width:720px;table-layout:fixed}
.round-table{border:0;background:transparent}
.round-table th,.round-table td{text-align:center;padding:10px 8px}
.round-table thead tr:first-child th{background:transparent;color:var(--ink);font-size:14px;border-bottom:0}
.round-table thead tr:first-child th:not(:first-child){text-align:center}
.round-table thead tr:nth-child(2) th{padding-top:4px;padding-bottom:12px;color:var(--mute);font-size:10px;border-bottom:1px solid var(--line)}
.round-table thead th:first-child,.round-table tbody th{text-align:left;width:76px}
.round-table thead tr:first-child th:first-child{border-bottom:1px solid var(--line)}
.round-table thead tr:first-child th:not(:first-child){border-left:1px solid var(--line)}
.round-table thead tr:nth-child(2) th{border-left:1px solid rgba(31,74,52,.65)}
.round-table thead tr:nth-child(2) th:nth-child(2n+1):not(:first-child){border-left:1px solid var(--line)}
.round-table tbody th{color:var(--mute);font-weight:500}
.round-table tbody tr:hover{background:rgba(255,255,255,.025)}
.round-table tbody th,.round-table tbody td{border-bottom:1px solid rgba(31,74,52,.65);border-right:1px solid rgba(31,74,52,.5)}
.round-table tbody td:nth-child(2n+1){border-left:1px solid var(--line)}
.round-table tbody th{border-left:0}
.round-table tfoot th,.round-table tfoot td{border-top:1px solid var(--green);border-bottom:0;font-weight:700;background:transparent}
.round-table tfoot th{text-align:left;color:var(--ink)}
.round-table tfoot td{border-right:1px solid rgba(31,74,52,.5)}
.round-table tfoot td:nth-child(2n){border-left:1px solid var(--line)}
.round-table tfoot td:last-child{border-right:0}
.round-table tfoot td:nth-child(2n){color:var(--gold)}
.round-table .total-points{white-space:nowrap}
.round-table .place-cup{display:inline-flex;vertical-align:middle;margin-left:5px}
.round-table .place-cup svg{width:18px;height:18px}
.round-table .place-cup.gold{color:#d9a441}.round-table .place-cup.silver{color:#c3cbd1}.round-table .place-cup.bronze{color:#c9743a}
.round-table td.best-round{color:var(--ink);font-weight:700;white-space:nowrap}
.round-table .best-round svg,.player-scores .best-round svg{width:15px;height:15px;vertical-align:-3px;margin-left:4px;color:#ef4444}
.round-table td.round-point{color:var(--gold);font-weight:700;background:transparent}
.round-point svg{width:16px;height:16px;vertical-align:-3px;margin-left:4px}
.chart{background:transparent;border:0;border-top:1px solid rgba(31,74,52,.65);border-bottom:1px solid rgba(31,74,52,.65);border-radius:0;padding:16px 8px;margin:0 0 22px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart-grid{stroke:var(--line);stroke-width:1}
.chart-axis-label{fill:var(--mute);font:12px 'Manrope',system-ui,sans-serif}
.chart-line{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chart-point{stroke:var(--card);stroke-width:2}
.chart-legend{display:flex;flex-wrap:wrap;gap:12px 22px;margin-top:10px}
.chart-legend span{display:inline-flex;align-items:center;gap:8px;color:var(--mute);font-size:14px}
.chart-legend i{width:10px;height:10px;border-radius:50%}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}
th,td{padding:14px 16px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.player-scores table{table-layout:fixed}
.player-scores th,.player-scores td{white-space:normal;overflow-wrap:anywhere}
.player-scores th:nth-child(1),.player-scores td:nth-child(1){width:32%}
.player-scores th:nth-child(2),.player-scores td:nth-child(2){width:12%}
.player-scores th:nth-child(3),.player-scores td:nth-child(3){width:12%}
.player-scores th:nth-child(4),.player-scores td:nth-child(4){width:26%}
.player-scores th:nth-child(5),.player-scores td:nth-child(5){width:18%}
@media(max-width:480px){.player-scores th,.player-scores td{padding:8px 5px;font-size:12px}.player-scores th{font-size:10px;letter-spacing:.03em}.player-scores .best-round svg{width:13px;height:13px;margin-left:2px}}
th{color:var(--mute);font-weight:500;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
tr.first td{color:var(--gold);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
.sc{position:relative;background:linear-gradient(145deg,rgba(17,52,35,.96),rgba(10,34,23,.98));border:1px solid rgba(73,120,89,.42);border-radius:14px;padding:24px;box-shadow:0 8px 22px rgba(0,0,0,.12)}
a.sc{display:block;color:var(--ink);text-decoration:none;transition:border-color .2s,transform .2s,box-shadow .2s,background .2s}
a.sc:hover{border-color:rgba(76,190,120,.7);background:linear-gradient(145deg,rgba(20,61,40,.98),rgba(11,39,26,.99));box-shadow:0 12px 28px rgba(0,0,0,.2),0 0 18px rgba(31,163,90,.08);transform:translateY(-3px)}
a.sc:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.sc h4{font:700 23px 'Manrope',system-ui,sans-serif;letter-spacing:-.025em;margin:0}
.player-avatar{width:52px;height:52px;display:grid;place-items:center;flex:none;border:1px solid rgba(93,147,108,.45);border-radius:15px;background:linear-gradient(145deg,rgba(31,163,90,.18),rgba(6,19,12,.52));box-shadow:inset 0 1px rgba(255,255,255,.05);font-size:27px}
.stand-player{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.stand-player-icon{font-size:20px;line-height:1}
.player-card-head{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.player-card-head h4{margin:0}
.player-card-head:after{content:"";height:1px;flex:1;margin-left:4px;background:linear-gradient(90deg,rgba(73,120,89,.4),transparent)}
.sc dl{gap:10px 8px}
.sc dt{font-size:14px}
.sc dd{font-variant-numeric:tabular-nums}
.player-card-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0 4px}
.player-card-stat{padding:11px 12px;border:1px solid rgba(73,120,89,.3);border-radius:10px;background:rgba(4,19,12,.24)}
.player-card-stat small{display:block;color:var(--mute);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.player-card-stat b{display:block;margin-top:3px;font-size:17px;font-variant-numeric:tabular-nums}
.player-trend{grid-column:1/-1;padding:12px;border:1px solid rgba(73,120,89,.3);border-radius:10px;background:rgba(4,19,12,.24)}
.player-trend-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.player-trend-head small{color:var(--mute);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.player-trend-head b{font-size:12px;color:var(--green)}
.player-trend-head b.worse{color:var(--gold)}
.player-trend-head b.better{color:var(--green)}
.player-trend svg{display:block;width:100%;height:46px;overflow:visible}
.player-trend-line{fill:none;stroke:var(--green);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.player-trend-point{fill:var(--gold);stroke:var(--card);stroke-width:2}
.player-trend-labels{display:flex;justify-content:space-between;gap:4px;color:var(--mute);font-size:10px}
.player-trend-labels span{text-align:center}
.round-table .par-score{display:block;margin-top:2px;color:var(--mute);font-size:11px;font-weight:500}
.round-table td.round-par{color:var(--gold);font-weight:700}
.player-profile{display:flex;align-items:center;gap:14px;margin:16px 0 24px}
.player-profile .player-avatar{width:56px;height:56px;font-size:30px}
.player-profile h1{margin:0;font-size:clamp(32px,5vw,46px)}
.player-profile p{margin:2px 0 0;color:var(--mute)}
.account-panel{margin:22px 0;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.account-panel h2{margin:0 0 8px;font:700 20px 'Manrope',system-ui,sans-serif}
.account-panel p{margin:0 0 14px;color:var(--mute)}
.account-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));align-items:end;gap:12px}
.account-form label{display:grid;gap:5px;color:var(--mute);font-size:13px}
.account-form input,.account-form select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.account-form button,.account-button{padding:11px 16px;border:1px solid var(--green);border-radius:99px;background:#0f5a32;color:#fff;font:600 13px 'Manrope',system-ui,sans-serif;cursor:pointer}
.account-form button:disabled,.account-button:disabled{opacity:.55;cursor:wait}
.account-message{min-height:1.5em;margin:10px 0 0!important;color:var(--gold)!important;font-size:14px}
.account-user{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sc dl{display:grid;grid-template-columns:1fr auto;gap:8px;margin:0}.sc dt{color:var(--mute)}.sc dd{margin:0;font-weight:600;text-align:right}
.player-link{display:inline-block;margin-top:16px;color:var(--mute);font-size:13px}
.bar{height:6px;border-radius:9px;background:var(--line);margin-top:16px}.bar i{display:block;height:100%;border-radius:9px;background:var(--green)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:40px;color:var(--mute);text-align:center}
.data-notice{margin:18px auto;padding:12px 16px;border:1px solid #8d6326;border-radius:8px;background:rgba(141,99,38,.15);color:#f0d39e}
.planning-intro{max-width:720px;color:var(--mute)}
.planning-list{display:grid;gap:16px;margin:24px 0 36px}
.planning-event{background:linear-gradient(145deg,rgba(15,43,29,.98),rgba(9,31,21,.98));border:1px solid var(--line);border-radius:14px;padding:26px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 30px}
.planning-event h2{font:700 24px/1.2 'Manrope',system-ui,sans-serif;margin:0 0 8px}
.planning-event p{margin:8px 0;color:var(--mute)}
.planning-date{color:var(--gold);font-weight:700}
.planning-place{color:var(--mute);font-size:14px}
.planning-actions{display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.planning-actions .btn{margin:0;padding:10px 16px}
.planning-share{display:flex;flex-wrap:wrap;gap:8px}
.planning-share button,.planning-share a{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 12px;border:1px solid var(--line);border-radius:99px;background:rgba(6,19,12,.38);color:var(--ink);font:600 12px 'Manrope',system-ui,sans-serif;text-decoration:none;cursor:pointer}
.planning-share button:hover,.planning-share a:hover{border-color:var(--green);background:rgba(31,163,90,.12)}
.planning-share button:disabled{opacity:.6;cursor:wait}
.planning-share-message{min-height:1.3em;margin:0!important;color:var(--gold);font-size:12px!important}
.planning-event-target{animation:planning-target 2.4s ease-out}
@keyframes planning-target{0%,35%{border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,164,65,.2)}100%{border-color:var(--line);box-shadow:none}}
@media(prefers-reduced-motion:reduce){.planning-event-target{animation:none;border-color:var(--gold)}}
.planning-rsvp{grid-column:1/-1;border-top:1px solid var(--line);padding-top:16px;display:grid;grid-template-columns:minmax(180px,1fr) auto auto;align-items:end;gap:10px}
.planning-rsvp label{display:grid;gap:5px;color:var(--mute);font-size:13px}
.planning-rsvp select{min-width:0;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.planning-rsvp button{padding:11px 16px;border:1px solid var(--green);border-radius:99px;background:#0f5a32;color:#fff;font:600 13px 'Manrope',system-ui,sans-serif;cursor:pointer}
.planning-rsvp button[data-response="nee"]{background:transparent;border-color:var(--line)}
.planning-rsvp button:disabled{opacity:.55;cursor:wait}
.planning-counts{font-size:14px;color:var(--mute)}
.planning-attendee-section{grid-column:1/-1;padding:16px 18px;border:1px solid rgba(73,120,89,.38);border-radius:12px;background:rgba(4,19,12,.32)}
.planning-attendee-heading{margin:0 0 12px;color:var(--mute);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.planning-attendees{display:flex;flex-wrap:wrap;gap:10px;color:var(--ink);font-size:15px}

function parseCsv(text){
 const rows=[];let row=[],field="",quoted=false;
 for(let i=0;i<text.length;i++){
  const ch=text[i];
  if(ch==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++}else quoted=!quoted}
  else if(ch===","&&!quoted){row.push(field.trim());field=""}
  else if((ch==="\n"||ch==="\r")&&!quoted){
   if(ch==="\r"&&text[i+1]==="\n")i++;
   row.push(field.trim());rows.push(row);row=[];field="";
  }else field+=ch;
 }
 if(field||row.length){row.push(field.trim());rows.push(row)}
 return rows;
}

function loadScores(competition){
 return new Promise(resolve=>{
  const callback=`gcpScoresCallback${Date.now()}_${++planningRequestNumber}`;
  const script=document.createElement("script");
  let timeout;
  const cleanup=()=>{delete window[callback];script.remove();clearTimeout(timeout)};
  const fail=error=>{competition.scoresError=error instanceof Error?error.message:String(error);cleanup();resolve()};
  timeout=setTimeout(()=>fail(new Error(`Het scoretabblad "${competition.sheetName}" reageert niet.`)),12000);
  window[callback]=result=>{
   cleanup();
   if(!result?.ok||!Array.isArray(result.rows)){fail(new Error(result?.error||"De scores konden niet worden geladen."));return}
   try{
  const rows=result.rows;
  const parColumn=(rows[1]||[]).findIndex(header=>/^par$/i.test(String(header||"").trim()));
  const columns=(rows[0]||[]).flatMap((name,index)=>{
   const playerName=String(name||"").trim();
   const strokesHeader=String(rows[1]?.[index]||"").trim();
   const pointsHeader=String(rows[1]?.[index+1]||"").trim();
   return playerName&&/^slagen$/i.test(strokesHeader)&&/^punten$/i.test(pointsHeader)
    ?[{name:playerName,strokes:index,points:index+1}]
    :[];
  });
  if(!columns.length)throw new Error("Geen spelerskolommen gevonden. Gebruik per speler een naam met daaronder de kolommen Slagen en Punten.");
  const players=columns.map(c=>({n:c.name,p:0,t:0}));
  const roundScores=[];
  for(let rowIndex=2;rowIndex<rows.length;rowIndex++){
   const row=rows[rowIndex];
   const roundNumber=competition.roundColumn===null?rowIndex-1:Number(row[competition.roundColumn]);
   if(!Number.isInteger(roundNumber)||roundNumber<1)continue;
   let played=false;
   const scores=columns.map(()=>({strokes:null,points:null}));
   columns.forEach((column,i)=>{
    const strokesText=row[column.strokes]?.trim(),pointsText=row[column.points]?.trim();
    const strokes=strokesText?Number(strokesText):NaN,points=pointsText?Number(pointsText):NaN;
    if(Number.isFinite(strokes)&&strokes>0){
     players[i].t+=strokes;
     if(Number.isFinite(points)){players[i].p+=points;scores[i].points=points}
     scores[i].strokes=strokes;
     played=true;
    }
   });
   if(played){
    const parText=parColumn>=0?String(row[parColumn]||"").trim():"";
    const par=parText?Number(parText.replace(",",".")):null;
    if(parText&&(!Number.isInteger(par)||par<1||par>100))throw new Error(`Vul bij ronde ${roundNumber} een geldige baan-PAR in, bijvoorbeeld 27.`);
    roundScores.push({number:roundNumber,par,scores});
   }
  }
  if(!roundScores.length)throw new Error("Er zijn geen gespeelde rondes gevonden in de spreadsheet");
  competition.spelers=players;
  competition.rondes=roundScores.length;
  competition.rondeScores=roundScores;
  competition.scoresError="";
   }catch(error){competition.scoresError=error instanceof Error?error.message:"Onbekende fout"}
   resolve();
  };
  script.onerror=()=>fail(new Error(`Het scoretabblad "${competition.sheetName}" kon niet worden geladen.`));
  script.src=`${PLANNING_API_URL}?action=scores&competition=${encodeURIComponent(competition.id)}&callback=${callback}`;
  document.head.append(script);
 });
}

 return `<div class="podium">`+sorted(c).map((s,i)=>{const [metal,color]=medals[i]||medals[2];const playerIndex=c.spelers.indexOf(s);const lowest=(c.rondeScores||[]).map(round=>round.scores[playerIndex]?.strokes).filter(strokes=>Number.isFinite(strokes)&&strokes>0);const lowestRound=lowest.length?Math.min(...lowest):"–";return `<div class="pc r${i+1}"><div class="medal ${metal}" role="img" aria-label="${i+1}e plaats, ${color} beker"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 4h16v7a8 8 0 0 1-16 0V4Z" fill="currentColor"/><path d="M8 7H4v3a7 7 0 0 0 6 6.8M24 7h4v3a7 7 0 0 1-6 6.8M16 19v5m-6 4h12m-10-4h8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="who"><b>${escapeHtml(s.n)}</b><span>${s.p} ${s.p===1?"punt":"punten"}</span></div><div class="num"><small>Totaal slagen</small><b>${s.t}</b></div><div class="num"><small>Gem. slagen</small><b>${f1(s.t/c.rondes)}</b></div><div class="num"><small>Laagste ronde</small><b>${lowestRound}</b></div></div>`}).join("")+`</div>`;
}

function pointsChart(c){
 const playedRounds=c.rondeScores||[];
 if(!playedRounds.length)return "";
 const isStrokePlay=c.scoring==="stroke-play";
 const rounds=[{number:0,scores:c.spelers.map(()=>({points:0}))},...playedRounds];
 const colors=["#55d98a","#efbd55","#7dbbe8"],width=720,height=290,left=48,right=18,top=18,bottom=38;
 const plotWidth=width-left-right,plotHeight=height-top-bottom;
 const totals=c.spelers.map(()=>0);
 const series=c.spelers.map((player,index)=>({name:player.n,color:colors[index%colors.length],values:rounds.map(round=>{const points=round.scores[index]?.points||0;if(!isStrokePlay)totals[index]+=points;return isStrokePlay?points:totals[index]})}));
 const maximum=Math.max(1,...series.flatMap(item=>item.values));
 const step=Math.max(1,Math.ceil(maximum/5)),yMax=Math.ceil(maximum/step)*step;
 const x=i=>left+(rounds.length===1?plotWidth/2:i*plotWidth/(rounds.length-1));
 const y=value=>top+plotHeight-(value/yMax)*plotHeight;
 const grid=Array.from({length:yMax/step+1},(_,i)=>{const value=i*step,py=y(value);return `<line class="chart-grid" x1="${left}" y1="${py}" x2="${width-right}" y2="${py}"/><text class="chart-axis-label" x="${left-10}" y="${py+4}" text-anchor="end">${value}</text>`}).join("");
 const labels=rounds.map((round,i)=>`<text class="chart-axis-label" x="${x(i)}" y="${height-10}" text-anchor="middle">${round.number}</text>`).join("");
 const lines=series.map(item=>`<polyline class="chart-line" stroke="${item.color}" points="${item.values.map((value,i)=>`${x(i)},${y(value)}`).join(" ")}"/>${item.values.map((value,i)=>`<circle class="chart-point" cx="${x(i)}" cy="${y(value)}" r="5" fill="${item.color}"><title>Ronde ${rounds[i].number}: ${escapeHtml(item.name)}, ${value} punten${isStrokePlay?" in deze ronde":" totaal"}</title></circle>`).join("")}`).join("");
 const legend=series.map(item=>`<span><i style="background:${item.color}"></i>${escapeHtml(item.name)}</span>`).join("");
 const valueDescription=isStrokePlay?"Punten per speler per ronde":"Opgetelde punten per speler na elke speelronde";
 return `<div class="chart" role="group" aria-label="${valueDescription}"><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${valueDescription}">${grid}${labels}${lines}</svg><div class="chart-legend">${legend}</div></div>`;
}

function loadSheetPlayerProfiles(){
 if(!PLANNING_API_URL)return;
 const callback=`gcpPlayersCallback${Date.now()}_${++planningRequestNumber}`;
 const script=document.createElement("script");
 let timeout;
 const cleanup=()=>{delete window[callback];script.remove();clearTimeout(timeout)};
 timeout=setTimeout(()=>{cleanup();playerProfilesError="De spelerprofielen konden niet worden geladen.";playerProfilesLoaded=true;route()},12000);
 window[callback]=result=>{
  cleanup();
  if(!result?.ok||!Array.isArray(result.players)){
   playerProfilesError=result?.error==="Onbekende planning-actie."?"De Apps Script-versie met spelersprofielen is nog niet geïmplementeerd.":result?.error||"De spelerprofielen konden niet worden geladen.";
   playerProfilesLoaded=true;
   route();
   return;
  }
  sheetPlayerProfiles=result.players;
  mergePlayerProfiles();
  playerProfilesError="";
  playerProfilesLoaded=true;
  route();
 };
 script.onerror=()=>{cleanup();playerProfilesError="De spelerprofielen konden niet worden geladen.";playerProfilesLoaded=true;route()};
 script.src=`${PLANNING_API_URL}${PLANNING_API_URL.includes("?")?"&":"?"}action=players&callback=${callback}`;
 document.head.append(script);
}
function mergePlayerProfiles(){
 const profilesByScoreName=new Map();
 sheetPlayerProfiles.forEach(profile=>{
  const key=String(profile.scoreName||profile.name||"").trim().toLocaleLowerCase("nl-NL");
  if(key)profilesByScoreName.set(key,{...profile,scoreName:profile.scoreName||profile.name});
 });
 firebasePlayerProfiles.forEach(profile=>{
  const key=String(profile.scoreName||profile.name||"").trim().toLocaleLowerCase("nl-NL");
  if(!key)return;
  const sheetProfile=profilesByScoreName.get(key)||{};
  profilesByScoreName.set(key,{...sheetProfile,...profile,
   icon:profile.icon||sheetProfile.icon||"⛳",
   handicap:profile.handicap===undefined?sheetProfile.handicap:profile.handicap
  });
 });
 playerProfiles=[...profilesByScoreName.values()];
}
function firebaseConfigured(){
 return Boolean(FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.authDomain&&FIREBASE_CONFIG.projectId&&FIREBASE_CONFIG.appId);
}
async function loadFirebaseProfiles(){
 const snapshot=await firestore.collection("profiles").get();
 firebasePlayerProfiles=snapshot.docs.map(document=>{
  const data=document.data();
  return {uid:document.id,name:data.displayName||data.scoreName,scoreName:data.scoreName,icon:data.icon||"⛳",handicap:data.handicap??null};
 });
 mergePlayerProfiles();
}
function loadPlayerProfiles(){
 loadSheetPlayerProfiles();
 if(!firebaseConfigured())return;
 if(!window.firebase){playerProfilesError="Firebase kon niet worden geladen. Controleer de Firebase-scriptverbinding.";playerProfilesLoaded=true;route();return}
 try{
  const app=window.firebase.apps.length?window.firebase.app():window.firebase.initializeApp(FIREBASE_CONFIG);
  firebaseAuth=app.auth();
  firestore=app.firestore();
  firebaseAuth.onAuthStateChanged(async user=>{
   currentUser=user;
   myPlayerProfile=null;
   myClaimRequest=null;
   playerProfilesError="";
   accountMessage="";
   try{
    if(user){
     const request=await firestore.collection("claimRequests").doc(user.uid).get();
     if(request.exists)myClaimRequest=request.data();
     if(myClaimRequest?.status==="approved"){
      const profile=await firestore.collection("profiles").doc(user.uid).get();
      if(profile.exists)myPlayerProfile=profile.data();
     }
    }
    await loadFirebaseProfiles();
   }catch(error){playerProfilesError=error.message||"De accounts konden niet worden geladen."}
   playerProfilesLoaded=true;
   route();
  },error=>{
   playerProfilesError=error.message||"Inloggen met Google is niet gelukt.";
   playerProfilesLoaded=true;
   route();
  });
 }catch(error){playerProfilesError=error.message||"Firebase kan niet worden gestart.";playerProfilesLoaded=true;route()}
}
function availableClaimNames(){
 const usedNames=new Set(playerProfiles
  .filter(profile=>profile.uid&&profile.uid!==currentUser?.uid)
  .map(profile=>String(profile.scoreName||profile.name||"").trim().toLocaleLowerCase("nl-NL")));
 const players=new Map();
 [...playerProfiles.map(profile=>profile.scoreName||profile.name),...COMPETITIES.flatMap(competition=>(competition.spelers||[]).map(player=>player.n))]
  .map(name=>String(name||"").trim())
  .filter(name=>name&&!usedNames.has(name.toLocaleLowerCase("nl-NL")))
  .forEach(name=>players.set(name.toLocaleLowerCase("nl-NL"),name));
 return [...players.values()].map(scoreName=>{
  const profile=playerProfileFor(scoreName);
  const playedCompetitions=countPlayedCompetitions(scoreName);
  const handicap=profile.handicap===null||profile.handicap===undefined||profile.handicap===""
   ?"HCP niet ingevuld"
   :`HCP ${Number(profile.handicap).toLocaleString("nl-NL",{maximumFractionDigits:1})}`;
  const competitionsLabel=`${playedCompetitions} ${playedCompetitions===1?"gespeelde competitie":"gespeelde competities"}`;
  return {scoreName,label:`${profile.name||scoreName} - ${handicap} - ${competitionsLabel}`};
 }).sort((first,second)=>first.label.localeCompare(second.label,"nl"));
}
function countPlayedCompetitions(scoreName){
 const normalized=String(scoreName||"").trim().toLocaleLowerCase("nl-NL");
 return COMPETITIES.reduce((total,competition)=>{
  const playerIndex=(competition.spelers||[]).findIndex(player=>String(player.n||"").trim().toLocaleLowerCase("nl-NL")===normalized);
  if(playerIndex<0)return total;
  const hasPlayed=(competition.rondeScores||[]).some(round=>{
   const score=round.scores?.[playerIndex];
   return score&&(score.strokes!==null&&score.strokes!==undefined||score.points!==null&&score.points!==undefined);
  });
  return total+(hasPlayed?1:0);
 },0);
}
function playerRoundStats(scoreName){
 const normalized=String(scoreName||"").trim().toLocaleLowerCase("nl-NL");
 const totalRounds=COMPETITIES.reduce((total,competition)=>{
  const playerIndex=(competition.spelers||[]).findIndex(player=>String(player.n||"").trim().toLocaleLowerCase("nl-NL")===normalized);
  return total+((competition.rondeScores||[]).filter(round=>{
   const score=round.scores?.[playerIndex];
   return playerIndex>=0&&score&&Number.isFinite(score.strokes)&&score.strokes>0;
  }).length);
 },0);
 const competition=live()||COMPETITIES.find(item=>item.rondeScores?.length);
 const playerIndex=(competition?.spelers||[]).findIndex(player=>String(player.n||"").trim().toLocaleLowerCase("nl-NL")===normalized);
 const rounds=playerIndex<0?[]:(competition.rondeScores||[]).filter(round=>{
  const strokes=round.scores?.[playerIndex]?.strokes;
  return Number.isFinite(strokes)&&strokes>0;
 });
 const averageStrokes=rounds.length?rounds.reduce((sum,round)=>sum+round.scores[playerIndex].strokes,0)/rounds.length:null;
 const roundsWithPar=rounds.filter(round=>Number.isFinite(round.par));
 const averageToPar=roundsWithPar.length===rounds.length&&rounds.length
  ?rounds.reduce((sum,round)=>sum+round.scores[playerIndex].strokes-round.par,0)/rounds.length
  :null;
 return {totalRounds,competition,playerIndex,rounds,averageStrokes,averageToPar};
}
function formatToPar(value){
 if(!Number.isFinite(value))return "–";
 if(value===0)return "E";
 return `${value>0?"+":""}${value.toLocaleString("nl-NL",{maximumFractionDigits:1})}`;
}
function playerTrendMarkup(stats){
 const recent=stats.rounds.slice(-3);
 if(!recent.length)return "";
 const hasPar=recent.every(round=>Number.isFinite(round.par));
 const values=recent.map(round=>hasPar?round.scores[stats.playerIndex].strokes-round.par:round.scores[stats.playerIndex].strokes);
 const spread=Math.max(...values)-Math.min(...values);
 const points=values.map((value,index)=>{
  const x=10+(recent.length===1?40:index*80/(recent.length-1));
  const y=8+(spread===0?16:(value-Math.min(...values))/spread*28);
  return {x,y,value};
 });
 const delta=values.length>1?values[values.length-1]-values[0]:0;
 const trend=values.length<2?"Nog geen trend":delta<0?"Score verbetert":delta>0?"Score loopt op":"Score gelijk";
 const trendClass=delta>0?"worse":delta<0?"better":"";
 const valueLabel=value=>hasPar?formatToPar(value):String(value);
 const labels=recent.map((round,index)=>`<span>R${round.number}: ${valueLabel(points[index].value)}</span>`).join("");
 const accessibleLabels=recent.map((round,index)=>`Ronde ${round.number}: ${valueLabel(points[index].value)}`).join(", ");
 return `<div class="player-trend"><div class="player-trend-head"><small>Laatste rondes · ${hasPar?"t.o.v. par":"slagen"} · ${escapeHtml(stats.competition?.naam||"")}</small><b class="${trendClass}">${trend}</b></div><svg viewBox="0 0 100 46" role="img" aria-label="Verloop laatste rondes: ${escapeHtml(accessibleLabels)}"><polyline class="player-trend-line" points="${points.map(point=>`${point.x},${point.y}`).join(" ")}"/>${points.map(point=>`<circle class="player-trend-point" cx="${point.x}" cy="${point.y}" r="3.5"><title>${escapeHtml(valueLabel(point.value))}</title></circle>`).join("")}</svg><div class="player-trend-labels">${labels}</div></div>`;
}
function roundScoreMarkup(strokes,par){
 if(!Number.isFinite(strokes)||!Number.isFinite(par))return `${strokes??"–"}`;
 return `${strokes}<span class="par-score">${formatToPar(strokes-par)} t.o.v. par</span>`;
}

function competitionForEvent(value){
 const normalized=String(value||"").trim().toLocaleLowerCase("nl-NL");
 return COMPETITIES.find(item=>item.id.toLocaleLowerCase("nl-NL")===normalized||item.naam.toLocaleLowerCase("nl-NL")===normalized);
}
function eventCompetition(event){return event.competition||event.title||""}
function calendarTimestamp(value){
 const parts=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Amsterdam",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(new Date(value));
 const fields=Object.fromEntries(parts.filter(part=>part.type!=="literal").map(part=>[part.type,part.value]));
 return `${fields.year}${fields.month}${fields.day}T${fields.hour}${fields.minute}${fields.second}`;
}
function formatPlanningDate(value){
 return new Intl.DateTimeFormat("nl-NL",{timeZone:"Europe/Amsterdam",weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(new Date(value));
}
function googleCalendarUrl(event){
 const params=new URLSearchParams({action:"TEMPLATE",text:event.title,dates:`${calendarTimestamp(event.start)}/${calendarTimestamp(event.end)}`,details:event.description||"",location:event.location||"",ctz:"Europe/Amsterdam"});
 return `https://calendar.google.com/calendar/render?${params}`;
}
function planningShareUrl(event){
 const params=new URLSearchParams({wedstrijd:event.id});
 return `${PUBLIC_SITE_URL}/#/planning?${params}`;
}
function planningShareMessage(event){

 </form>`:`<p class="planning-message">Aan- en afmelden voor deze wedstrijd is gesloten.</p>`;

  ${event.attendees?.length?`<section class="planning-attendee-section" aria-label="Aanwezig gemeld"><h3 class="planning-attendee-heading">Aanwezig gemeld</h3><div class="planning-attendees">${event.attendees.map(planningAttendee).join("")}</div></section>`:""}
  ${responseForm}
 </article>`;

function loadPlanningEvents(competitionId,containerId="planning-events",upcomingOnly=false){
 const container=document.getElementById(containerId);
 if(!container)return;
 container.dataset.competitionId=competitionId||"";
 container.dataset.upcomingOnly=String(upcomingOnly);
 if(!PLANNING_API_URL){
  container.innerHTML='<div class="empty planning-empty">De planning is nog niet gekoppeld. Volg PLANNING-SETUP.md om de Google Sheet en gedeelde aan-/afmeldingen in te stellen.</div>';
  return;
 }
 const callback=`gcpPlanningCallback${Date.now()}${++planningRequestNumber}`;
 const script=document.createElement("script");
 const cleanup=()=>{delete window[callback];script.remove();clearTimeout(timeout)};
 const timeout=setTimeout(()=>{cleanup();container.innerHTML='<div class="data-notice" role="alert">De planning reageert niet. Controleer de Apps Script-link en probeer opnieuw.</div>'},12000);
 window[callback]=result=>{
  cleanup();
  if(!result?.ok||!Array.isArray(result.events)){
   container.innerHTML=`<div class="data-notice" role="alert">${escapeHtml(result?.error||"De planning kon niet worden geladen.")}</div>`;
   return;
  }
  const events=result.events.filter(item=>!competitionId||competitionForEvent(eventCompetition(item))?.id===competitionId);
  const visibleEvents=upcomingOnly?events.filter(item=>new Date(item.start)>Date.now()):events;
  const emptyMessage=upcomingOnly?"Er zijn nog geen aankomende wedstrijden voor deze competitie.":competitionId?"Er staan nog geen wedstrijden voor deze competitie in de planning.":"Er staan nog geen wedstrijden in de planning.";
  container.innerHTML=visibleEvents.length?`<div class="planning-list">${visibleEvents.map(planningCard).join("")}</div>`:`<div class="empty planning-empty">${emptyMessage}</div>`;
  const eventId=container.dataset.eventId;
  if(eventId){
   const target=document.getElementById(`planning-event-${eventId}`);
   if(target){
    target.classList.add("planning-event-target");
    setTimeout(()=>target.scrollIntoView({behavior:"smooth",block:"center"}),0);
   }
  }
 };
 script.onerror=()=>{cleanup();container.innerHTML='<div class="data-notice" role="alert">De planning kon niet worden geladen. Controleer de Apps Script-link en probeer opnieuw.</div>'};
 script.src=`${PLANNING_API_URL}${PLANNING_API_URL.includes("?")?"&":"?"}action=list&callback=${callback}`;
 document.head.append(script);
}

document.addEventListener("submit",event=>{

 if(!(form instanceof HTMLFormElement)||!form.matches(".planning-rsvp"))return;
 event.preventDefault();
 const button=event.submitter;
 if(!(button instanceof HTMLButtonElement)||!["ja","nee"].includes(button.value))return;

 if(!responseField){responseField=document.createElement("input");responseField.type="hidden";responseField.name="response";form.append(responseField)}
 responseField.value=button.value;
 const responseTimeout=setTimeout(()=>{
  const pending=planningPendingResponses.get(nonce);
  if(!pending)return;
  planningPendingResponses.delete(nonce);
  pending.form.querySelectorAll("button").forEach(item=>item.disabled=false);
  pending.status.textContent="Er kwam geen bevestiging van Google Sheets. Controleer je verbinding en probeer opnieuw.";
 },20000);
 planningPendingResponses.set(nonce,{status,form,timeout:responseTimeout,containerId:form.closest("[data-planning-events]")?.id,competitionId:form.closest("[data-planning-events]")?.dataset.competitionId||"",upcomingOnly:form.closest("[data-planning-events]")?.dataset.upcomingOnly==="true"});
 status.textContent="Je reactie wordt opgeslagen…";
 form.querySelectorAll("button").forEach(item=>item.disabled=true);
 frame.src="about:blank";
 HTMLFormElement.prototype.submit.call(form);
});
window.addEventListener("message",event=>{
 const frame=$("#planning-rsvp-frame");
 if(!frame||event.source!==frame.contentWindow)return;
 let host="";
 try{host=new URL(event.origin).hostname}catch{return}
 if(host!=="script.google.com"&&!host.endsWith(".googleusercontent.com"))return;
 const result=event.data;
 if(result?.type!=="gcp-rsvp"||typeof result.nonce!=="string")return;
 const pending=planningPendingResponses.get(result.nonce);
 if(!pending)return;
 planningPendingResponses.delete(result.nonce);
 clearTimeout(pending.timeout);
 pending.form.querySelectorAll("button").forEach(button=>button.disabled=false);
 pending.status.textContent=result.ok?"Je reactie is opgeslagen.":`Opslaan is niet gelukt: ${result.message||"probeer het opnieuw."}`;
 if(result.ok&&pending.containerId)setTimeout(()=>loadPlanningEvents(pending.competitionId,pending.containerId,pending.upcomingOnly),350);
});
function competities(){return `<div class="wrap page"><h1>Competities</h1><p style="color:var(--mute)">Lopende, aankomende en afgelopen competities. Oude standen blijven altijd beschikbaar.</p><div class="tiles" style="margin-top:20px">${COMPETITIES.map(tile).join("")}</div></div>`}
function cupIcon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0V4Z"/><path d="M8 6H5v2a4 4 0 0 0 4 4m7-6h3v2a4 4 0 0 1-4 4m-3 1v4m-4 3h8m-6-3h4"/></svg>'}
function flameIcon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a7 7 0 0 0 7-7c0-3-2-5.4-4.6-8.1.1 2.3-.7 3.8-1.7 4.8C12.4 7.2 10 3.6 7 2 7.6 6.6 5 8.9 5 14a7 7 0 0 0 7 8Z"/><path d="M12 22a3.5 3.5 0 0 0 3.5-3.5c0-1.5-.9-2.7-2.1-4-.1 1.2-.6 2-1.4 2.5-.2-1.7-1-2.8-2-3.5.2 2.2-1.5 3-1.5 5A3.5 3.5 0 0 0 12 22Z"/></svg>'}
function standChoices(){
 const competitions=COMPETITIES.filter(c=>c.sheetName);
 return `<div class="wrap page"><h1>Stand</h1><p style="color:var(--mute)">Kies een competitie</p><div class="stand-choices">${competitions.map(c=>`<a class="stand-choice" href="#/stand/${c.id}">${closeup(c.id)}<span>${escapeHtml(c.naam)}</span><b aria-hidden="true">→</b></a>`).join("")}</div></div>`;
}
function stand(id){
 if(!id)return standChoices();
 const c=COMPETITIES.find(x=>x.id===id&&x.sheetName); if(!c)return standChoices();
 const rounds=c.rondeScores||[];
 const bestStrokes=c.spelers.map((_,i)=>Math.min(...rounds.map(round=>round.scores[i]?.strokes).filter(strokes=>Number.isFinite(strokes)&&strokes>0),Infinity));
 const ranked=sorted(c), medals=["gold","silver","bronze"];
 const roundRows=rounds.map(round=>`<tr><th scope="row">${round.number}</th><td class="round-par">${round.par??"–"}</td>${round.scores.map((score,i)=>`<td${score.strokes===bestStrokes[i]?` class="best-round" title="Laagste ronde van ${escapeHtml(c.spelers[i].n)}"`:""}>${roundScoreMarkup(score.strokes,round.par)}${score.strokes===bestStrokes[i]?flameIcon():""}</td>${score.points>0?`<td class="round-point" aria-label="${score.points} ${score.points===1?"punt":"punten"} gescoord"><span>${score.points}</span>${cupIcon()}</td>`:`<td>${score.points??"–"}</td>`}`).join("")}</tr>`).join("");
 const totalCells=c.spelers.map((s,i)=>{const place=ranked.indexOf(s);const medal=medals[place];return `<td>${s.t}</td><td class="total-points">${s.p}${medal?`<span class="place-cup ${medal}" role="img" aria-label="${place+1}e plaats">${cupIcon()}</span>`:""}</td>`}).join("");
 const summary=c.scoring==="stroke-play"?"Stroke play: de speler met het laagste totaal aantal slagen wint.":"Per ronde levert de beste score een punt op.";
 return `<div class="wrap page"><a class="back-to-stand" href="#/stand"><span aria-hidden="true">←</span> Andere competitie kiezen</a><h1>${c.naam}</h1><p style="color:var(--mute)">Gebaseerd op ${c.rondes} gespeelde rondes. ${summary}</p>
 <div class="sec"><div><h3>Aankomende wedstrijden</h3><small>Wedstrijden uit de planning voor deze competitie</small></div><hr><a href="#/planning/${c.id}">Volledige planning →</a></div>
 <div id="competition-planning" data-planning-events aria-live="polite"><div class="empty planning-empty">Planning wordt geladen…</div></div>
 <div class="sec"><div><h3>Tussenstand</h3><small>Na ${c.rondes} gespeelde rondes</small></div><hr></div>
 <div class="stand-summary"><table><tr><th>#</th><th>Icoon / Naam</th><th>Punten</th><th>Totaal slagen</th><th>Gemiddeld aantal slagen</th></tr>${sorted(c).map((s,i)=>`<tr class="${i?"":"first"}"><td>${i+1}</td><td><a href="#/speler/${encodeURIComponent(s.n)}">${standPlayer(s.n)}</a></td><td>${s.p}</td><td>${s.t}</td><td>${f1(s.t/c.rondes)}</td></tr>`).join("")}</table></div>
 <div class="sec"><div><h3>Speelrondes</h3><small>Slagen, baan-PAR en punten per speler per ronde</small></div><hr></div>
 <div class="scroll"><table class="round-table"><thead><tr><th rowspan="2" scope="col">Ronde</th><th rowspan="2" scope="col">Par</th>${c.spelers.map(s=>`<th colspan="2" scope="colgroup">${escapeHtml(s.n)}</th>`).join("")}</tr><tr>${c.spelers.map(()=>'<th scope="col">Slagen</th><th scope="col">Punten</th>').join("")}</tr></thead><tbody>${roundRows}</tbody><tfoot><tr><th scope="row" colspan="2">Totaal</th>${totalCells}</tr></tfoot></table></div>
 <div class="sec"><div><h3>${c.scoring==="stroke-play"?"Punten per ronde":"Puntenverloop"}</h3><small>${c.scoring==="stroke-play"?"Punten per speler per speelronde":"Opgetelde punten per ronde"}</small></div><hr></div>
 ${pointsChart(c)}</div>`;
}
function spelers(){
 if(!playerProfilesLoaded&&!COMPETITIES.some(competition=>competition.rondeScores?.length))return `<div class="wrap page"><h1>Spelers</h1><div class="empty">Spelers worden geladen…</div></div>`;
 const playersByName=new Map();
 playerProfiles.forEach(profile=>{
  const scoreName=profile.scoreName||profile.name;
  if(scoreName)playersByName.set(scoreName.trim().toLocaleLowerCase("nl-NL"),{name:profile.name||scoreName,scoreName,profile,competitions:[]});
 });
 COMPETITIES.forEach(competition=>(competition.spelers||[]).forEach(player=>{
  const key=player.n.trim().toLocaleLowerCase("nl-NL");
  if(!key)return;
  if(!playersByName.has(key))playersByName.set(key,{name:player.n,scoreName:player.n,profile:playerProfileFor(player.n),competitions:[]});
  const entry=playersByName.get(key);
  if(entry.profile.name===entry.scoreName)entry.name=player.n;
  if(!entry.competitions.some(item=>item.id===competition.id))entry.competitions.push(competition);
 }));
 const players=[...playersByName.values()].sort((a,b)=>a.name.localeCompare(b.name,"nl"));
 if(!players.length)return `<div class="wrap page"><h1>Spelers</h1>${profileAccountPanel()}${playerProfilesError?`<div class="data-notice" role="alert">${escapeHtml(playerProfilesError)}</div>`:""}<div class="empty">Er zijn nog geen spelers. De beheerder kan je aanvraag aan een bestaande score-naam koppelen.</div></div>`;
 return `<div class="wrap page"><h1>Spelers</h1><p style="color:var(--mute)">Iedere speler staat één keer in de lijst. Beheer je profiel via je Google-account.</p>${profileAccountPanel()}${playerProfilesError?`<div class="data-notice" role="alert">${escapeHtml(playerProfilesError)}</div>`:""}<div class="cards">${players.map(player=>{
  const profile=player.profile,handicap=profile.handicap===null?"Niet ingevuld":profile.handicap.toLocaleString("nl-NL",{maximumFractionDigits:1});
  const playedCompetitions=countPlayedCompetitions(player.scoreName);
   const stats=playerRoundStats(player.scoreName);
   const averageStrokes=stats.averageStrokes===null?"–":stats.averageStrokes.toLocaleString("nl-NL",{minimumFractionDigits:1,maximumFractionDigits:1});
   const averageToPar=stats.averageToPar===null?"–":formatToPar(stats.averageToPar);
   return `<a class="sc" href="#/speler/${encodeURIComponent(player.scoreName)}" aria-label="Bekijk het profiel van ${escapeHtml(player.name)}"><div class="player-card-head"><span class="player-avatar" aria-hidden="true">${escapeHtml(profile.icon)}</span><h4>${escapeHtml(player.name)}</h4></div><dl><dt>Handicap</dt><dd>${handicap}</dd><dt>Gespeelde competities</dt><dd>${playedCompetitions}</dd></dl><div class="player-card-stats"><div class="player-card-stat"><small>Rondes gespeeld</small><b>${stats.totalRounds}</b></div><div class="player-card-stat"><small>Gem. slagen · ${escapeHtml(stats.competition?.naam||"huidige competitie")}</small><b>${averageStrokes}</b></div><div class="player-card-stat"><small>Gem. t.o.v. par</small><b>${averageToPar}</b></div>${playerTrendMarkup(stats)}</div><span class="player-link">Bekijk profiel en scoregeschiedenis →</span></a>`;
 }).join("")}</div></div>`;
}
function speler(id){
 let requestedName=id;
 try{requestedName=decodeURIComponent(id)}catch{}
 const normalized=requestedName.trim().toLocaleLowerCase("nl-NL");
 const profile=playerProfiles.find(item=>(item.scoreName||item.name).toLocaleLowerCase("nl-NL")===normalized);
 const scorePlayer=COMPETITIES.flatMap(c=>c.spelers).find(s=>s.n.trim().toLocaleLowerCase("nl-NL")===normalized);
 const scoreName=profile?.scoreName||profile?.name||scorePlayer?.n;
 const playerName=profile?.name||scoreName;
 if(!playerName)return `<div class="wrap page"><h1>Speler niet gevonden</h1><div class="empty">Deze speler staat niet in de huidige competitie.</div><p><a href="#/spelers">← Terug naar spelers</a></p></div>`;
 const playerProfile=profile||playerProfileFor(scoreName);
 const competitions=COMPETITIES.map(c=>({competition:c,index:c.spelers.findIndex(s=>s.n.trim().toLocaleLowerCase("nl-NL")===(scoreName||"").trim().toLocaleLowerCase("nl-NL"))})).filter(({competition,index})=>index>=0&&(competition.rondeScores||[]).some(round=>round.scores[index]?.strokes!=null||round.scores[index]?.points!=null));
 const rows=competitions.flatMap(({competition,index})=>{const played=(competition.rondeScores||[]).filter(round=>round.scores[index]?.strokes!=null||round.scores[index]?.points!=null);const bestStrokes=Math.min(...played.map(round=>round.scores[index]?.strokes).filter(strokes=>Number.isFinite(strokes)&&strokes>0),Infinity);return played.map(round=>{const strokes=round.scores[index]?.strokes;const best=strokes===bestStrokes;return `<tr><td><a href="#/stand/${competition.id}">${escapeHtml(competition.naam)}</a></td><td>${round.number}</td><td>${round.par??"–"}</td><td${best?' class="best-round" title="Beste ronde van deze competitie"':""}>${roundScoreMarkup(strokes,round.par)}${best?flameIcon():""}</td><td>${round.scores[index]?.points??"–"}</td></tr>`})}).join("");
 const handicap=playerProfile.handicap===null?"Handicap nog niet ingevuld":`Handicap ${playerProfile.handicap.toLocaleString("nl-NL",{maximumFractionDigits:1})}`;
 return `<div class="wrap page"><p><a href="#/spelers">← Terug naar spelers</a></p><div class="player-profile"><span class="player-avatar" aria-hidden="true">${escapeHtml(playerProfile.icon)}</span><div><h1>${escapeHtml(playerName)}</h1><p>${handicap}</p></div></div><p style="color:var(--mute)">Alle geregistreerde wedstrijdscores en de bijbehorende competities.</p>${rows?`<div class="scroll player-scores"><table><thead><tr><th>Competitie</th><th>Ronde</th><th>Par</th><th>Slagen</th><th>Punten</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">Er zijn nog geen ronde-uitslagen beschikbaar voor deze speler.</div>`}</div>`;
}
function toernooien(){return `<div class="wrap page"><h1>Toernooien</h1><p style="color:var(--mute)">Binnenkort meer nieuws over het volgende golftoernooi.</p><div class="tiles" style="margin-top:20px">${tournamentTile()}</div></div>`}

const NAV=[["","Home"],["competities","Competities"],["planning","Planning"],["stand","Stand"],["spelers","Spelers"],["toernooien","Toernooien"]];
function route(){
 const [hashPath,hashQuery=""]=(location.hash||"#/").slice(1).split("?");
 const [,p="",id]=(hashPath||"/").split("/");
 const eventId=new URLSearchParams(hashQuery).get("wedstrijd")||"";
 $("#nav").innerHTML=NAV.map(([k,t])=>`<a href="#/${k}" class="${k===p?"on":""}">${t}</a>`).join("");
 $("#app").innerHTML=({"":home,competities,planning:()=>planning(id,eventId),stand:()=>stand(id),spelers,speler:()=>speler(id),toernooien}[p]||home)();
 if(p==="planning")loadPlanningEvents(id);
 if(p==="stand"&&id)loadPlanningEvents(id,"competition-planning",true);
 let neededScores=[];
 if(!p){
  const current=live();
  if(current?.sheetName)neededScores=[current];
 }else if(p==="competities"||p==="spelers"||p==="speler"){
  neededScores=COMPETITIES.filter(competition=>competition.sheetName);
 }else if(p==="stand"&&id){
  const competition=COMPETITIES.find(item=>item.id===id);
  if(competition?.sheetName)neededScores=[competition];
 }
 const pendingScores=neededScores.filter(competition=>!scoreRequests.has(competition.id));
 if(pendingScores.length){
  pendingScores.forEach(competition=>scoreRequests.add(competition.id));
  Promise.all(pendingScores.map(loadScores)).then(route);
 }
 const notice=scoresNotice();if(notice)$("#app").insertAdjacentHTML("afterbegin",`<div class="wrap">${notice}</div>`);
 window.scrollTo(0,0);
}
addEventListener("hashchange",route);route();loadPlayerProfiles();
</script>
</body>
</html>
