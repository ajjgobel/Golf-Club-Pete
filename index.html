<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Golf Club Pete</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#06130c;--card:#0d281b;--line:#1f4a34;--ink:#eef3ec;--mute:#9db3a5;--green:#1fa35a;--gold:#d9a441;--silver:#c3cbd1;--bronze:#c9743a;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 'Manrope',system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(6,19,12,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:28px;height:78px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);flex:none}
.brand img{width:62px;height:62px;object-fit:contain}
nav{display:flex;gap:26px;overflow-x:auto;flex:1;scrollbar-width:none}
nav a{color:var(--ink);text-decoration:none;font-size:14px;letter-spacing:.07em;text-transform:uppercase;padding:8px 0;border-bottom:2px solid transparent;white-space:nowrap}
nav a.on{border-color:var(--green)}
.tag{font-size:13px;color:var(--mute);line-height:1.3;display:flex;gap:10px;align-items:center;flex:none}
.tag svg{width:34px;height:34px}
@media(max-width:980px){.tag{display:none}}
@media(max-width:640px){header .wrap{gap:14px}.brand img{width:46px;height:46px}}
.hero{position:relative;min-height:340px;overflow:hidden}
.hero-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 54%}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,19,12,.72),rgba(6,19,12,.24) 60%,rgba(6,19,12,.08)),linear-gradient(0deg,var(--bg),transparent 45%)}
.hero .wrap{position:relative;z-index:1;padding-top:44px;padding-bottom:50px}
.hero small{display:block;font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
h1{font:800 clamp(46px,9vw,84px)/1.05 'Manrope',system-ui,sans-serif;letter-spacing:-.045em;margin:8px 0 10px}
.hero p{font-size:18px;font-weight:500;margin:0}
.page{padding:36px 0 10px}
.page h1{font-size:clamp(38px,6vw,56px)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:26px;margin-top:-14px;position:relative;z-index:2}
.stand-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px;margin-top:24px}
.stand-choice{position:relative;isolation:isolate;display:flex;align-items:flex-end;min-height:190px;padding:22px;border:1px solid var(--line);border-radius:12px;overflow:hidden;color:var(--ink);text-decoration:none;background:var(--card);transition:border-color .2s,transform .2s}
.stand-choice:hover{border-color:var(--green);transform:translateY(-2px)}
.stand-choice:after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(0deg,rgba(5,17,10,.88),rgba(5,17,10,.08) 90%)}
.stand-choice>.bg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;object-fit:cover;filter:brightness(.68) saturate(.82)}
.stand-choice span{position:relative;z-index:1;font:700 22px/1.2 'Manrope',system-ui,sans-serif;letter-spacing:-.02em}
.stand-choice b{margin-left:auto;font-size:22px}
.tile{position:relative;border-radius:14px;overflow:hidden;min-height:292px;border:1px solid var(--line);padding:20px 22px;display:flex;flex-direction:column}
.tile.live{border:2px solid var(--green);box-shadow:0 0 34px rgba(31,163,90,.28)}
.tile.open{border:2px solid var(--green);box-shadow:0 0 34px rgba(31,163,90,.28)}
.tile.soon{border-color:#555d58}
.tile.tournament{border-color:#546c70;box-shadow:0 0 30px rgba(81,123,133,.18)}
.tile>.bg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.tile>img.bg{object-fit:cover;object-position:center;filter:brightness(.7) saturate(.88)}
.tile.soon>img.bg{filter:grayscale(1) brightness(.65)}
.tile:after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(90deg,rgba(5,17,10,.48),rgba(5,17,10,.08) 95%),linear-gradient(0deg,rgba(5,17,10,.42),transparent 62%);pointer-events:none}
.tile.soon>svg.bg{filter:grayscale(1)}
.tile>*:not(.bg){position:relative;z-index:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:6px 16px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.pill.l{background:rgba(14,90,50,.85);border:1px solid var(--green)}
.pill.w{background:rgba(255,255,255,.88);color:#1b2a22}
.pill.o{border:1px solid rgba(255,255,255,.7);background:rgba(0,0,0,.25)}
.dot{width:10px;height:10px;border-radius:50%;background:#fff;animation:p 1.8s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}70%,100%{box-shadow:0 0 0 9px transparent}}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
.tile h2{font:700 clamp(27px,4vw,34px)/1.12 'Manrope',system-ui,sans-serif;letter-spacing:-.035em;margin:18px 0 8px;max-width:18ch}
.meta{font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.tile p{max-width:40ch;margin:0 0 14px;font-size:14px}
.home-section{padding-top:30px}
.home-section:first-of-type{padding-top:12px}
.home-section-title{display:flex;align-items:center;gap:16px;margin:0 0 20px}
.home-section-title h2{margin:0;font:700 20px 'Manrope',system-ui,sans-serif;letter-spacing:.01em;text-transform:uppercase}
.home-section-title hr{flex:1;border:0;border-top:1px solid var(--line)}
.home-standings{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;margin:0 0 24px}
.home-standing{min-width:0;padding:18px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(145deg,rgba(18,39,27,.9),rgba(7,20,13,.94))}
.home-standing-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.home-standing-title h3{margin:0;font:700 17px 'Manrope',system-ui,sans-serif}
.home-standing-title a{color:var(--mute);font-size:12px;text-decoration:none;white-space:nowrap}
.home-standing-title a:hover{color:var(--ink)}
.home-standing-columns{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,145px),1fr));gap:16px}
.home-standing-group h4{margin:0 0 8px;color:var(--mute);font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.home-standing-group ol{display:grid;gap:7px;margin:0;padding:0;list-style:none}
.home-standing-group li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:7px;font-size:12px}
.home-standing-group .rank{color:var(--mute);font-size:11px;font-variant-numeric:tabular-nums}
.home-standing-group li:first-child .rank{color:var(--gold);font-weight:800}
.home-standing-group .stand-player{min-width:0;gap:6px;overflow:hidden;text-overflow:ellipsis}
.home-standing-group .stand-player-icon{font-size:16px}
.home-standing-stats{display:flex;align-items:baseline;justify-content:flex-end;gap:10px}
.home-standing-stat{display:inline-flex;align-items:baseline;gap:3px;white-space:nowrap}
.home-standing-stat small{color:var(--mute);font-size:9px}
.home-standing-stat b{font-size:11px;font-variant-numeric:tabular-nums}
.home-standing-empty{grid-column:1/-1;margin:0;color:var(--mute);font-size:13px}
.home-standing-loading{color:var(--mute);font-size:13px}
@media(max-width:520px){.home-standing{padding:15px}.home-standing-columns{gap:12px}.home-standing-group li{font-size:11px}}
.btn{margin-top:auto;align-self:flex-start;display:inline-flex;gap:12px;padding:14px 26px;border-radius:99px;font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:#fff;background:#0f5a32;border:1px solid var(--green)}
.tile .btn{padding:10px 19px;font-size:12px}
.btn.off{background:rgba(120,125,122,.55);border-color:#999;color:#e8e8e8;cursor:default}
.back-to-stand{display:inline-flex;align-items:center;gap:9px;margin:0 0 18px;padding:10px 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font-size:14px;font-weight:600;text-decoration:none;transition:border-color .2s,background .2s}
.back-to-stand:hover{border-color:var(--green);background:#123523}
.sec{display:flex;align-items:center;gap:16px;margin:46px 0 18px}
.sec h3{margin:0;font:700 20px 'Manrope',system-ui,sans-serif;letter-spacing:.01em;text-transform:uppercase}
.sec small{display:block;color:var(--mute);font-size:13px}
.sec hr{flex:1;border:0;border-top:1px solid var(--line)}
.sec a{color:var(--ink);font-size:14px;text-decoration:none}
.podium{display:grid;gap:10px}
.pc{display:grid;grid-template-columns:56px minmax(0,1fr) repeat(3,minmax(110px,auto));align-items:center;gap:18px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 20px}
.pc.r1{border-color:#6b5524;background:linear-gradient(90deg,rgba(217,164,65,.1),var(--card) 34%)}
.pc.r3{border-color:#6b4023}
.medal{width:42px;height:42px;display:grid;place-items:center;flex:none}
.medal svg{width:34px;height:34px}
.medal.gold{color:#d9a441}.medal.silver{color:#c3cbd1}.medal.bronze{color:#c9743a}
.pc .who{min-width:0}.pc .who b{font:700 18px 'Manrope',system-ui,sans-serif;display:block}.pc .who span{color:var(--mute);font-size:13px}
.pc .num{border-left:1px solid var(--line);padding-left:18px;text-align:left}
.pc .num small{display:block;font-size:11px;color:var(--mute);letter-spacing:.05em;text-transform:uppercase}.pc .num b{font-weight:500;font-size:18px}
@media(max-width:760px){.pc{grid-template-columns:44px minmax(0,1fr) minmax(0,1fr);gap:10px 12px;padding:14px}.medal{grid-row:1 / span 3;width:38px;height:38px}.medal svg{width:32px;height:32px}.pc .who{grid-column:2 / 4;grid-row:1}.pc .num{padding-left:10px}.pc .num:nth-child(3){grid-column:2;grid-row:2}.pc .num:nth-child(4){grid-column:3;grid-row:2}.pc .num:nth-child(5){grid-column:2 / 4;grid-row:3}}
.scroll{overflow-x:auto}
.stand-summary{margin-top:22px;border:1px solid rgba(73,120,89,.42);border-radius:14px;background:linear-gradient(150deg,rgba(13,40,27,.9),rgba(7,24,16,.96));overflow-x:auto;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.stand-summary table{min-width:550px;border:0;background:transparent}
.stand-summary th,.stand-summary td{padding:12px 16px;border-bottom:1px solid rgba(73,120,89,.22)}
.stand-summary thead th{background:rgba(3,15,9,.28);font-size:11px;letter-spacing:.08em}
.stand-summary thead th:nth-child(2){text-align:left}
.stand-summary tbody tr:last-child td{border-bottom:0}
.stand-summary tbody tr:hover{background:rgba(255,255,255,.025)}
.stand-summary tbody td:first-child{width:54px;color:var(--mute);font-variant-numeric:tabular-nums}
.stand-summary tbody td:nth-child(2){text-align:left}
.stand-summary tbody td:nth-child(n+3){font-variant-numeric:tabular-nums}
.stand-summary tbody tr.first{background:linear-gradient(90deg,rgba(217,164,65,.09),transparent 78%)}
.stand-summary tbody tr.first td:nth-child(2){color:var(--gold)}
.stand-summary .rank-badge{display:inline-grid;place-items:center;width:26px;height:26px;border:1px solid rgba(157,179,165,.25);border-radius:50%;font-size:12px;font-weight:700}
.stand-summary .rank-badge.gold{border-color:rgba(217,164,65,.55);background:rgba(217,164,65,.12);color:var(--gold)}
.stand-summary .rank-badge.silver{border-color:rgba(195,203,209,.42);color:var(--silver)}
.stand-summary .rank-badge.bronze{border-color:rgba(201,116,58,.45);color:var(--bronze)}
.round-table{width:max-content;min-width:100%;table-layout:fixed}
.round-table{border:0;background:transparent}
.round-table th,.round-table td{text-align:center;padding:7px 6px}
.round-table thead tr:first-child th{background:rgba(3,15,9,.28);color:var(--ink);font-size:13px;border-bottom:0}
.round-table thead tr:first-child th:not(:first-child){text-align:center}
.round-table thead tr:nth-child(2) th{padding:7px 5px;color:var(--mute);font-size:10px;line-height:1.2;white-space:normal;border-bottom:1px solid var(--line)}
.round-table thead th:first-child,.round-table tbody th{text-align:left;width:54px}
.round-table thead th:nth-child(2){width:54px}
.round-table thead tr:first-child th:first-child{border-bottom:1px solid var(--line)}
.round-table thead tr:first-child th:not(:first-child){border-left:1px solid var(--line)}
.round-table thead tr:nth-child(2) th{border-left:1px solid rgba(31,74,52,.65)}
.round-table thead tr:nth-child(2) th.group-start{border-left:1px solid var(--line)}
.round-table tbody th{color:var(--mute);font-weight:600;font-variant-numeric:tabular-nums}
.round-table tbody tr:hover{background:rgba(31,163,90,.055)}
.round-table tbody th,.round-table tbody td{border-bottom:1px solid rgba(73,120,89,.34);border-right:1px solid rgba(73,120,89,.28)}
.round-table tbody tr:nth-child(even){background:rgba(255,255,255,.022)}
.round-table tbody td.group-start{border-left:1px solid rgba(73,120,89,.5)}
.round-table tbody th{border-left:0}
.round-table tfoot th,.round-table tfoot td{border-top:1px solid rgba(31,163,90,.6);border-bottom:0;font-weight:700;background:rgba(31,163,90,.055)}
.round-table tfoot th{text-align:left;color:var(--ink)}
.round-table tfoot td{border-right:1px solid rgba(31,74,52,.5)}
.round-table tfoot td.group-start{border-left:1px solid var(--line)}
.round-table tfoot td:last-child{border-right:0}
.round-table tfoot td.total-points{color:var(--gold)}
.round-table tfoot td.total-stableford{color:var(--ink)}
.round-table td.round-stableford{color:var(--green);font-weight:650;font-variant-numeric:tabular-nums}
.round-table td.stableford-win-point{color:var(--green)}
.round-table .total-points{white-space:nowrap}
.round-table .place-cup{display:inline-flex;vertical-align:middle;margin-left:5px}
.round-table .place-cup svg{width:18px;height:18px}
.round-table .place-cup.gold{color:#d9a441}.round-table .place-cup.silver{color:#c3cbd1}.round-table .place-cup.bronze{color:#c9743a}
.round-table td.best-round{color:var(--ink);font-weight:700;white-space:nowrap}
.round-table .best-round svg,.player-scores .best-round svg{width:13px;height:13px;vertical-align:-2px;margin-left:3px;color:#ef4444}
.round-table td.round-point{color:var(--gold);font-weight:700;background:transparent}
.round-table td.round-score-cell{font-weight:650;font-variant-numeric:tabular-nums}
.round-table .round-score-content{position:relative;display:inline-block;min-width:3ch;padding-left:16px;text-align:center;vertical-align:middle}
.round-table .round-score-value{display:block}
.round-table .round-flame{position:absolute;left:0;top:50%;display:inline-flex;align-items:center;transform:translateY(-50%);line-height:0}
.round-table .round-flame svg{display:block;width:13px;height:13px;color:#ef4444}
.round-table td.round-point{font-variant-numeric:tabular-nums;text-align:center!important;vertical-align:middle}
.round-table .round-award{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:38px}
.round-table .round-place-icon{display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:1}
.round-table .round-place-icon.gold{color:var(--gold)}
.round-table .round-place-icon.silver{color:var(--silver)}
.round-table .round-place-icon.bronze{color:var(--bronze)}
.round-table td.round-par{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.round-table-wrap{margin-top:16px;max-width:100%;border:1px solid rgba(73,120,89,.38);border-radius:14px;background:linear-gradient(150deg,rgba(13,40,27,.74),rgba(7,24,16,.9));box-shadow:0 8px 24px rgba(0,0,0,.1)}
.round-table-wrap{overflow-x:auto;overscroll-behavior-inline:contain}
.round-table-wrap .round-table{margin:0}
.round-table-wrap .round-table tr:last-child>*{border-bottom:0}
.round-point svg{width:13px;height:13px;vertical-align:-2px;margin-left:3px}
.chart{background:transparent;border:0;border-top:1px solid rgba(31,74,52,.65);border-bottom:1px solid rgba(31,74,52,.65);border-radius:0;padding:16px 8px;margin:0 0 22px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart-grid{stroke:var(--line);stroke-width:1}
.chart-axis-label{fill:var(--mute);font:12px 'Manrope',system-ui,sans-serif}
.chart-line{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chart-point{stroke:var(--card);stroke-width:2}
.chart-legend{display:flex;flex-wrap:wrap;gap:12px 22px;margin-top:10px}
.chart-legend span{display:inline-flex;align-items:center;gap:8px;color:var(--mute);font-size:14px}
.chart-legend i{width:10px;height:10px;border-radius:50%}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}
th,td{padding:14px 16px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.player-scores table{table-layout:fixed}
.player-scores th,.player-scores td{white-space:normal;overflow-wrap:anywhere}
.player-scores th:nth-child(1),.player-scores td:nth-child(1){width:23%}
.player-scores th:nth-child(2),.player-scores td:nth-child(2){width:8%}
.player-scores th:nth-child(3),.player-scores td:nth-child(3){width:12%}
.player-scores th:nth-child(4),.player-scores td:nth-child(4){width:12%}
.player-scores th:nth-child(5),.player-scores td:nth-child(5){width:15%}
.player-scores th:nth-child(6),.player-scores td:nth-child(6){width:15%}
.player-scores th:nth-child(7),.player-scores td:nth-child(7){width:15%}
@media(max-width:480px){.player-scores th,.player-scores td{padding:8px 5px;font-size:12px}.player-scores th{font-size:10px;letter-spacing:.03em}.player-scores .best-round svg{width:13px;height:13px;margin-left:2px}}
th{color:var(--mute);font-weight:500;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
.sc{position:relative;background:linear-gradient(145deg,rgba(17,52,35,.96),rgba(10,34,23,.98));border:1px solid rgba(73,120,89,.42);border-radius:14px;padding:20px;box-shadow:0 8px 22px rgba(0,0,0,.12)}
a.sc{display:block;color:var(--ink);text-decoration:none;transition:border-color .2s,transform .2s,box-shadow .2s,background .2s}
a.sc:hover{border-color:rgba(76,190,120,.7);background:linear-gradient(145deg,rgba(20,61,40,.98),rgba(11,39,26,.99));box-shadow:0 12px 28px rgba(0,0,0,.2),0 0 18px rgba(31,163,90,.08);transform:translateY(-3px)}
a.sc:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.sc h4{font:700 23px 'Manrope',system-ui,sans-serif;letter-spacing:-.025em;margin:0}
.player-avatar{width:50px;height:50px;display:grid;place-items:center;flex:none;border:1px solid rgba(93,147,108,.45);border-radius:15px;background:linear-gradient(145deg,rgba(31,163,90,.18),rgba(6,19,12,.52));box-shadow:inset 0 1px rgba(255,255,255,.05);font-size:26px}
.stand-player{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.stand-player-icon{font-size:20px;line-height:1}
.player-card-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.player-card-head h4{margin:0}
.player-card-head:after{content:"";height:1px;flex:1;margin-left:4px;background:linear-gradient(90deg,rgba(73,120,89,.4),transparent)}
.sc dl{gap:10px 8px}
.sc dt{font-size:14px}
.sc dd{font-variant-numeric:tabular-nums}
.player-card-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0 2px}
.player-card-stat{padding:8px 10px;border:1px solid rgba(73,120,89,.3);border-radius:9px;background:rgba(4,19,12,.24)}
.player-card-stat small{display:block;color:var(--mute);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.player-card-stat b{display:block;margin-top:2px;font-size:16px;font-variant-numeric:tabular-nums}
.player-card-competitions small{margin-left:5px;color:var(--mute);font-size:12px;font-weight:500}

 <div class="tag" style="display:none"></div>
</div></header>

<iframe id="planning-rsvp-frame" name="planning-rsvp-frame" title="Reactie op wedstrijd opslaan" hidden></iframe>
<div class="wrap"><footer><hr><span>Golf Club Pete &nbsp;·&nbsp; Est. 2018</span><hr></footer></div>

<script>
/* ===== GEGEVENS: pas hier aan =====
   status: "live" | "soon" | "old"   p = Strokeplay-winpunten, t = totaal aantal slagen */
const COMPETITIES=[
 {id:"par-3-2026",naam:"Par 3 2026",status:"live",scoring:"points",sheetName:"Scores",rondes:7,tekst:"De Par 3 2026 is in volle gang! Wie pakt de meeste winpunten en gaat er met de winst vandoor?",roundColumn:0,spelers:[],scoresLoaded:false},
 {id:"par-3-2027",naam:"Par 3 2027",status:"soon",scoring:"points",sheetName:"Scores",rondes:7,tekst:"De Par 3 2027 staat gepland voor volgend jaar. Binnenkort meer informatie.",spelers:[],scoresLoaded:false},
 {id:"platte-piet-cup-2026",naam:"Platte Piet Cup 2026",status:"live",scoring:"stroke-play",sheetName:"Scores",holes:9,baan:"Grote baan Heemskerk",tekst:"De Platte Piet Cup 2026 is in volle gang. Bekijk de live stand en volg de strijd om de winst.",roundColumn:null,spelers:[],scoresLoaded:false},
 {id:"platte-piet-cup-2027",naam:"Platte Piet Cup 2027",status:"soon",scoring:"stroke-play",sheetName:"Scores",holes:9,baan:"Grote baan Heemskerk",tekst:"De Platte Piet Cup 2027 staat gepland voor volgend jaar. Binnenkort meer informatie.",roundColumn:null,spelers:[],scoresLoaded:false},
];
/* ================================== */
const PLANNING_API_URL="https://script.google.com/macros/s/AKfycbxOPEifaG4wxNswdLY2AjhBS-KEzYzS9wSaOxnajMIyRSNehxdXcbwpFjRZnLgqyNJVUQ/exec";
const PUBLIC_SITE_URL="https://golfclubpete.nl";
const $=s=>document.querySelector(s), f1=n=>n.toFixed(1).replace(".",","), escapeHtml=s=>String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const live=()=>COMPETITIES.find(c=>c.status==="live");
const sorted=c=>[...c.spelers].sort(c.scoring==="stroke-play"?(a,b)=>a.t-b.t||b.p-a.p:(a,b)=>b.p-a.p||a.t-b.t);
let scoresErrors=[];
const scoreRequests=new Set();
let planningRequestNumber=0;
const planningPendingResponses=new Map();
let playerProfiles=[];
let sheetPlayerProfiles=[];
let playerProfilesLoaded=false;
let playerProfilesError="";

function parseCsv(text){
 const rows=[];let row=[],field="",quoted=false;
 for(let i=0;i<text.length;i++){
  const ch=text[i];
  if(ch==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++}else quoted=!quoted}
  else if(ch===","&&!quoted){row.push(field.trim());field=""}
  else if((ch==="\n"||ch==="\r")&&!quoted){
   if(ch==="\r"&&text[i+1]==="\n")i++;
   row.push(field.trim());rows.push(row);row=[];field="";
  }else field+=ch;
 }
 if(field||row.length){row.push(field.trim());rows.push(row)}
 return rows;
}

function loadScores(competition){
 return new Promise(resolve=>{
  const callback=`gcpScoresCallback${Date.now()}_${++planningRequestNumber}`;
  const script=document.createElement("script");
  let timeout;
  const cleanup=()=>{delete window[callback];script.remove();clearTimeout(timeout)};
  const fail=error=>{competition.scoresError=error instanceof Error?error.message:String(error);competition.scoresLoaded=true;cleanup();resolve()};
  timeout=setTimeout(()=>fail(new Error(`Het scoretabblad "${competition.sheetName}" reageert niet.`)),12000);
  window[callback]=result=>{
   cleanup();
   if(!result?.ok||!Array.isArray(result.rows)){fail(new Error(result?.error||"De scores konden niet worden geladen."));return}
   try{
  const rows=result.rows;
  const expectedHeaders=["competitie","ronde","par","speler","slagen","stableford"];
  if((rows[0]||[]).slice(0,expectedHeaders.length).map(value=>String(value||"").trim().toLocaleLowerCase("nl-NL")).join("\u0000")!==expectedHeaders.join("\u0000")){
   throw new Error("De scoreservice gebruikt nog de oude indeling. Implementeer de nieuwste Apps Script-webappversie via Apps Script → Implementeren → Implementaties beheren → Bewerken → Nieuwe versie.");
  }
  if(rows.length===1){
   competition.spelers=[];
   competition.rondes=0;
   competition.rondeScores=[];
   competition.scoresError="";
   competition.scoresLoaded=true;
   resolve();
   return;
  }
  const roundsByNumber=new Map(),playersByName=new Map();
  const asScoreNumber=value=>{const text=String(value??"").trim();if(!text)return null;const number=Number(text.replace(",","."));return Number.isFinite(number)?number:NaN};
  for(let rowIndex=1;rowIndex<rows.length;rowIndex++){
   const row=rows[rowIndex];
   if(row.every(value=>!String(value??"").trim()))continue;
   const competitionId=String(row[0]||"").trim().toLocaleLowerCase("nl-NL");
   const roundNumber=asScoreNumber(row[1]),par=asScoreNumber(row[2]),playerName=String(row[3]||"").trim();
   const strokes=asScoreNumber(row[4]),stableford=asScoreNumber(row[5]);
   if(competitionId!==competition.id.toLocaleLowerCase("nl-NL"))throw new Error(`Rij ${rowIndex+1}: de competitie-ID komt niet overeen met ${competition.id}.`);
   if(!Number.isInteger(roundNumber)||roundNumber<1)throw new Error(`Rij ${rowIndex+1}: vul een geheel rondenummer in vanaf 1.`);
   if(!playerName)throw new Error(`Rij ${rowIndex+1}: vul de spelernaam in.`);
   if(par!==null&&(!Number.isInteger(par)||par<1||par>100))throw new Error(`Ronde ${roundNumber}: vul een gehele baan-PAR van 1 t/m 100 in.`);
   if(strokes!==null&&(!Number.isInteger(strokes)||strokes<1))throw new Error(`Ronde ${roundNumber}, ${playerName}: slagen moet een positief geheel getal zijn.`);
   if(stableford!==null&&(!Number.isInteger(stableford)||stableford<0))throw new Error(`Ronde ${roundNumber}, ${playerName}: Stableford moet een geheel getal van nul of hoger zijn.`);
   if(stableford!==null&&strokes===null)throw new Error(`Ronde ${roundNumber}, ${playerName}: vul eerst het aantal slagen in bij de Stableford-score.`);
   const playerKey=playerName.toLocaleLowerCase("nl-NL"),roundKey=`${roundNumber}`;
   let round=roundsByNumber.get(roundKey);
   if(!round){round={number:roundNumber,par,scores:new Map()};roundsByNumber.set(roundKey,round)}
   else if(par!==round.par)throw new Error(`Ronde ${roundNumber}: vul voor iedere speler dezelfde baan-PAR in.`);
   if(round.scores.has(playerKey))throw new Error(`Ronde ${roundNumber}: ${playerName} staat meer dan één keer in het tabblad Scores voor deze competitie.`);
   if(!playersByName.has(playerKey))playersByName.set(playerKey,{n:playerName,p:0,t:0,strokeRounds:0,stableford:0,stablefordRounds:0,stablefordP:0});
   round.scores.set(playerKey,{strokes,stableford,points:strokes===null?null:0,stablefordPoint:stableford===null?null:0});
  }
  const players=[...playersByName.values()];
  const roundScores=[...roundsByNumber.values()].sort((a,b)=>a.number-b.number).map(round=>({
   ...round,
   scores:players.map(player=>round.scores.get(player.n.toLocaleLowerCase("nl-NL"))||{strokes:null,stableford:null,points:null,stablefordPoint:null})
  }));
  if(!roundScores.length)throw new Error("Er zijn nog geen scoregegevens voor deze competitie in het tabblad Scores.");
  roundScores.forEach(round=>{
   const strokeScores=round.scores.filter(score=>Number.isFinite(score.strokes));
   const stablefordScores=round.scores.filter(score=>Number.isFinite(score.stableford));
   const lowestStrokes=strokeScores.length?Math.min(...strokeScores.map(score=>score.strokes)):null;
   const highestStableford=stablefordScores.length?Math.max(...stablefordScores.map(score=>score.stableford)):null;
   round.scores.forEach((score,index)=>{
    const player=players[index];
    if(Number.isFinite(score.strokes)){
     player.t+=score.strokes;
     player.strokeRounds++;
     score.place=1+strokeScores.filter(other=>other.strokes<score.strokes).length;
     if(score.strokes===lowestStrokes){score.points=1;player.p++}
    }
    if(Number.isFinite(score.stableford)){
     player.stableford+=score.stableford;
     player.stablefordRounds++;
     score.stablefordPlace=1+stablefordScores.filter(other=>other.stableford>score.stableford).length;
     if(score.stableford===highestStableford){score.stablefordPoint=1;player.stablefordP++}
    }
   });
  });
  competition.spelers=players;
  competition.rondes=roundScores.length;
  competition.rondeScores=roundScores;
  competition.scoresError="";
   competition.scoresLoaded=true;
   }catch(error){competition.scoresError=error instanceof Error?error.message:"Onbekende fout";competition.scoresLoaded=true}
   resolve();
  };
  script.onerror=()=>fail(new Error(`Het scoretabblad "${competition.sheetName}" kon niet worden geladen.`));
  script.src=`${PLANNING_API_URL}?action=scores&competition=${encodeURIComponent(competition.id)}&callback=${callback}`;
  document.head.append(script);
 });
}

function podium(c){
 const medals=[["gold","gouden"],["silver","zilveren"],["bronze","bronzen"]];
 return `<div class="podium">`+sorted(c).map((s,i)=>{const [metal,color]=medals[i]||medals[2];const playerIndex=c.spelers.indexOf(s);const lowest=(c.rondeScores||[]).map(round=>round.scores[playerIndex]?.strokes).filter(strokes=>Number.isFinite(strokes)&&strokes>0);const lowestRound=lowest.length?Math.min(...lowest):"–";const averageRounds=s.strokeRounds||c.rondes;return `<div class="pc r${i+1}"><div class="medal ${metal}" role="img" aria-label="${i+1}e plaats, ${color} beker"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 4h16v7a8 8 0 0 1-16 0V4Z" fill="currentColor"/><path d="M8 7H4v3a7 7 0 0 0 6 6.8M24 7h4v3a7 7 0 0 1-6 6.8M16 19v5m-6 4h12m-10-4h8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="who"><b>${escapeHtml(s.n)}</b><span>${s.p} ${s.p===1?"winpunt":"winpunten"}</span></div><div class="num"><small>Totaal slagen</small><b>${s.t}</b></div><div class="num"><small>Gem. slagen</small><b>${averageRounds?f1(s.t/averageRounds):"–"}</b></div><div class="num"><small>Laagste ronde</small><b>${lowestRound}</b></div></div>`}).join("")+`</div>`;
}

function pointsChart(c,pointKey,label){
 const playedRounds=c.rondeScores||[];
 if(!playedRounds.length)return "";
 const rounds=[{number:0,scores:c.spelers.map(()=>({[pointKey]:0}))},...playedRounds];
 const colors=["#55d98a","#efbd55","#7dbbe8"],width=720,height=290,left=48,right=18,top=18,bottom=38;
 const plotWidth=width-left-right,plotHeight=height-top-bottom;
 const totals=c.spelers.map(()=>0);
 const series=c.spelers.map((player,index)=>({name:player.n,color:colors[index%colors.length],values:rounds.map(round=>{totals[index]+=round.scores[index]?.[pointKey]||0;return totals[index]})}));
 const maximum=Math.max(1,...series.flatMap(item=>item.values));
 const step=Math.max(1,Math.ceil(maximum/5)),yMax=Math.ceil(maximum/step)*step;
 const x=i=>left+(rounds.length===1?plotWidth/2:i*plotWidth/(rounds.length-1));
 const y=value=>top+plotHeight-(value/yMax)*plotHeight;
 const grid=Array.from({length:yMax/step+1},(_,i)=>{const value=i*step,py=y(value);return `<line class="chart-grid" x1="${left}" y1="${py}" x2="${width-right}" y2="${py}"/><text class="chart-axis-label" x="${left-10}" y="${py+4}" text-anchor="end">${value}</text>`}).join("");
 const labels=rounds.map((round,i)=>`<text class="chart-axis-label" x="${x(i)}" y="${height-10}" text-anchor="middle">${round.number}</text>`).join("");
 const lines=series.map(item=>`<polyline class="chart-line" stroke="${item.color}" points="${item.values.map((value,i)=>`${x(i)},${y(value)}`).join(" ")}"/>${item.values.map((value,i)=>`<circle class="chart-point" cx="${x(i)}" cy="${y(value)}" r="5" fill="${item.color}"><title>Ronde ${rounds[i].number}: ${escapeHtml(item.name)}, ${value} winpunten totaal</title></circle>`).join("")}`).join("");
 const legend=series.map(item=>`<span><i style="background:${item.color}"></i>${escapeHtml(item.name)}</span>`).join("");
 const valueDescription=label+" per speler na elke speelronde";
 return `<div class="chart" role="group" aria-label="${valueDescription}"><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${valueDescription}">${grid}${labels}${lines}</svg><div class="chart-legend">${legend}</div></div>`;
}

function homeCompetitionStanding(competition){
 const title=`<div class="home-standing-title"><h3>${escapeHtml(competition.naam)}</h3><a href="#/stand/${competition.id}">Volledige stand →</a></div>`;

  .filter(player=>player.strokeRounds>0)

 const stablefordGroup=stablefordPlayers.length?`<div class="home-standing-group"><h4>Stableford-punten · gem. Stableford</h4>${playerRows(stablefordPlayers,player=>`<span class="home-standing-stat"><small>Gem. Stableford</small><b>${f1(player.stableford/player.stablefordRounds)}</b></span><span class="home-standing-stat"><small>Punten</small><b>${player.stablefordP}</b></span>`)}</div>`:"";
 return `<article class="home-standing">${title}<div class="home-standing-columns">${strokeGroup}${stablefordGroup}</div></article>`;

 window[callback]=result=>{

function mergePlayerProfiles(){
 playerProfiles=sheetPlayerProfiles.map(profile=>({...profile,scoreName:profile.scoreName||profile.name}));

function countPlayedCompetitions(scoreName){
 const normalized=String(scoreName||"").trim().toLocaleLowerCase("nl-NL");
 return COMPETITIES.reduce((total,competition)=>{
  const playerIndex=(competition.spelers||[]).findIndex(player=>String(player.n||"").trim().toLocaleLowerCase("nl-NL")===normalized);
  if(playerIndex<0)return total;
  const hasPlayed=(competition.rondeScores||[]).some(round=>{
   const score=round.scores?.[playerIndex];
   return score&&(score.strokes!==null&&score.strokes!==undefined||score.points!==null&&score.points!==undefined);
  });
  return total+(hasPlayed?1:0);
 },0);
}
function playerRoundStats(scoreName){
 const normalized=String(scoreName||"").trim().toLocaleLowerCase("nl-NL");
 const totalRounds=COMPETITIES.reduce((total,competition)=>{
  const playerIndex=(competition.spelers||[]).findIndex(player=>String(player.n||"").trim().toLocaleLowerCase("nl-NL")===normalized);
  return total+((competition.rondeScores||[]).filter(round=>{
   const score=round.scores?.[playerIndex];
   return playerIndex>=0&&score&&Number.isFinite(score.strokes)&&score.strokes>0;
  }).length);
 },0);
 const competition=live()||COMPETITIES.find(item=>item.rondeScores?.length);
 const playerIndex=(competition?.spelers||[]).findIndex(player=>String(player.n||"").trim().toLocaleLowerCase("nl-NL")===normalized);
 const rounds=playerIndex<0?[]:(competition.rondeScores||[]).filter(round=>{
  const strokes=round.scores?.[playerIndex]?.strokes;
  return Number.isFinite(strokes)&&strokes>0;
 });
 const averageStrokes=rounds.length?rounds.reduce((sum,round)=>sum+round.scores[playerIndex].strokes,0)/rounds.length:null;
 const roundsWithPar=rounds.filter(round=>Number.isFinite(round.par));
 const averageToPar=roundsWithPar.length===rounds.length&&rounds.length
  ?rounds.reduce((sum,round)=>sum+round.scores[playerIndex].strokes-round.par,0)/rounds.length
  :null;
 return {totalRounds,competition,playerIndex,rounds,averageStrokes,averageToPar};
}
function formatToPar(value){
 if(!Number.isFinite(value))return "–";
 if(value===0)return "E";
 return `${value>0?"+":""}${value.toLocaleString("nl-NL",{maximumFractionDigits:1})}`;
}
function playerTrendMarkup(stats){
 const recent=stats.rounds.slice(-5);
 if(!recent.length)return "";
 if(!recent.every(round=>Number.isFinite(round.par)))return `<div class="player-trend"><div class="player-trend-head"><small>Laatste rondes · t.o.v. par · ${escapeHtml(stats.competition?.naam||"")}</small></div><small>Trend beschikbaar zodra de PAR per ronde is ingevuld.</small></div>`;
 const values=recent.map(round=>round.scores[stats.playerIndex].strokes-round.par);
 const scale=Math.max(1,...values.map(Math.abs));
 const baseline=16;
 const points=values.map((value,index)=>{
  const x=10+(recent.length===1?40:index*80/(recent.length-1));
  const y=baseline-value/scale*10;
  return {x,y,value};
 });
 const delta=values.length>1?values[values.length-1]-values[0]:0;
 const trend=values.length<2?"Nog geen trend":delta<0?"Score verbetert":delta>0?"Score loopt op":"Score gelijk";
 const trendClass=delta>0?"worse":delta<0?"better":"";
 const labels=recent.map((round,index)=>`<span>R${round.number}: ${formatToPar(points[index].value)}</span>`).join("");
 const accessibleLabels=recent.map((round,index)=>`Ronde ${round.number}: ${formatToPar(points[index].value)}`).join(", ");
 return `<div class="player-trend"><div class="player-trend-head"><small>Laatste rondes · afwijking van PAR · ${escapeHtml(stats.competition?.naam||"")}</small><b class="${trendClass}">${trend}</b></div><svg viewBox="0 0 100 32" role="img" aria-label="Verloop ten opzichte van PAR, nul is PAR: ${escapeHtml(accessibleLabels)}"><line class="player-trend-baseline" x1="4" y1="${baseline}" x2="96" y2="${baseline}"/><polyline class="player-trend-line" points="${points.map(point=>`${point.x},${point.y}`).join(" ")}"/>${points.map(point=>`<circle class="player-trend-point" cx="${point.x}" cy="${point.y}" r="3"><title>${escapeHtml(formatToPar(point.value))}</title></circle>`).join("")}</svg><div class="player-trend-labels">${labels}</div></div>`;
}
function competitionForEvent(value){
 const normalized=String(value||"").trim().toLocaleLowerCase("nl-NL");
 const aliases={"2026":"par-3-2026","2026 par 3 competitie":"par-3-2026","2027":"par-3-2027","2027 par 3 competitie":"par-3-2027","platte piet cup":"platte-piet-cup-2026"};
 const competitionId=aliases[normalized]||normalized.replace(/[\s_]+/g,"-");
 return COMPETITIES.find(item=>item.id.toLocaleLowerCase("nl-NL")===competitionId||item.naam.toLocaleLowerCase("nl-NL")===normalized);
}
function eventCompetition(event){return event.competition||event.title||""}
function calendarTimestamp(value){
 const parts=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Amsterdam",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(new Date(value));
 const fields=Object.fromEntries(parts.filter(part=>part.type!=="literal").map(part=>[part.type,part.value]));
 return `${fields.year}${fields.month}${fields.day}T${fields.hour}${fields.minute}${fields.second}`;
}
function formatPlanningDate(value){
 return new Intl.DateTimeFormat("nl-NL",{timeZone:"Europe/Amsterdam",weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(new Date(value));
}
function googleCalendarUrl(event){

 return `https://calendar.google.com/calendar/render?${params}`;
}

 </form>`:`<p class="planning-message">Aan- en afmelden voor deze wedstrijd is gesloten.</p>`;
 return `<article class="planning-event" id="${escapeHtml(`planning-event-${event.id}`)}">

  ${event.attendees?.length?`<section class="planning-attendee-section" aria-label="Aanwezig gemeld"><h3 class="planning-attendee-heading">Aanwezig gemeld</h3><div class="planning-attendees">${event.attendees.map(planningAttendee).join("")}</div></section>`:""}
  ${responseForm}
 </article>`;

function loadPlanningEvents(competitionId,containerId="planning-events",upcomingOnly=false){
 const container=document.getElementById(containerId);
 if(!container)return;
 container.dataset.competitionId=competitionId||"";
 container.dataset.upcomingOnly=String(upcomingOnly);
 if(!PLANNING_API_URL){
  container.innerHTML='<div class="empty planning-empty">De planning is nog niet gekoppeld. Volg PLANNING-SETUP.md om de Google Sheet en gedeelde aan-/afmeldingen in te stellen.</div>';
  return;
 }
 const callback=`gcpPlanningCallback${Date.now()}${++planningRequestNumber}`;
 const script=document.createElement("script");
 const cleanup=()=>{delete window[callback];script.remove();clearTimeout(timeout)};
 const timeout=setTimeout(()=>{cleanup();container.innerHTML='<div class="data-notice" role="alert">De planning reageert niet. Controleer de Apps Script-link en probeer opnieuw.</div>'},12000);
 window[callback]=result=>{
  cleanup();
  if(!result?.ok||!Array.isArray(result.events)){
   container.innerHTML=`<div class="data-notice" role="alert">${escapeHtml(result?.error||"De planning kon niet worden geladen.")}</div>`;
   return;
  }
  const events=result.events.filter(item=>new Date(item.start)>Date.now()&&(!competitionId||competitionForEvent(eventCompetition(item))?.id===competitionId));
  const visibleEvents=events;
  const emptyMessage=competitionId?"Er zijn geen aankomende wedstrijden voor deze competitie.":"Er zijn geen aankomende wedstrijden in de planning.";
  container.innerHTML=visibleEvents.length?`<div class="planning-list">${visibleEvents.map(planningCard).join("")}</div>`:`<div class="empty planning-empty">${emptyMessage}</div>`;
  const eventId=container.dataset.eventId;
  if(eventId){
   const target=document.getElementById(`planning-event-${eventId}`);
   if(target){
    target.classList.add("planning-event-target");
    setTimeout(()=>target.scrollIntoView({behavior:"smooth",block:"center"}),0);
   }
  }
 };
 script.onerror=()=>{cleanup();container.innerHTML='<div class="data-notice" role="alert">De planning kon niet worden geladen. Controleer de Apps Script-link en probeer opnieuw.</div>'};
 script.src=`${PLANNING_API_URL}${PLANNING_API_URL.includes("?")?"&":"?"}action=list&callback=${callback}`;
 document.head.append(script);
}
document.addEventListener("click",async event=>{
 const button=event.target.closest("[data-copy-planning-link]");
 if(!button)return;
 const status=button.closest(".planning-actions").querySelector(".planning-share-message");
 button.disabled=true;
 try{
  await navigator.clipboard.writeText(button.dataset.copyPlanningLink);
  status.textContent="Link gekopieerd. Je kunt deze nu delen.";
 }catch(error){
  status.textContent="Kopiëren is niet gelukt. Open ‘Deel via WhatsApp’ om de link te delen.";
 }finally{button.disabled=false}
});
document.addEventListener("submit",event=>{
 const form=event.target;
 if(!(form instanceof HTMLFormElement)||!form.matches(".planning-rsvp"))return;
 event.preventDefault();
 const button=event.submitter;
 if(!(button instanceof HTMLButtonElement)||!["ja","nee"].includes(button.value))return;
 const playerSelect=form.elements.namedItem("name");
 if(!(playerSelect instanceof HTMLSelectElement)||!playerSelect.value){
  form.querySelector(".planning-message").textContent="Kies eerst een speler uit de lijst.";
  return;
 }
 const status=form.querySelector(".planning-message");
 const nonce=form.dataset.nonce;
 const frame=$("#planning-rsvp-frame");
 if(!nonce||!frame){status.textContent="De reactie kon niet worden voorbereid. Vernieuw de pagina en probeer opnieuw.";return}
 let responseField=form.querySelector('input[type="hidden"][name="response"]');
 if(!responseField){responseField=document.createElement("input");responseField.type="hidden";responseField.name="response";form.append(responseField)}
 responseField.value=button.value;
 const responseTimeout=setTimeout(()=>{
  const pending=planningPendingResponses.get(nonce);
  if(!pending)return;
  planningPendingResponses.delete(nonce);
  pending.form.querySelectorAll("button").forEach(item=>item.disabled=false);
  pending.status.textContent="Er kwam geen bevestiging van Google Sheets. Controleer je verbinding en probeer opnieuw.";
 },20000);
 planningPendingResponses.set(nonce,{status,form,timeout:responseTimeout,containerId:form.closest("[data-planning-events]")?.id,competitionId:form.closest("[data-planning-events]")?.dataset.competitionId||"",upcomingOnly:form.closest("[data-planning-events]")?.dataset.upcomingOnly==="true"});
 status.textContent="Je reactie wordt opgeslagen…";
 form.querySelectorAll("button").forEach(item=>item.disabled=true);
 frame.src="about:blank";
 HTMLFormElement.prototype.submit.call(form);
});
window.addEventListener("message",event=>{
 const frame=$("#planning-rsvp-frame");
 if(!frame||event.source!==frame.contentWindow)return;
 let host="";
 try{host=new URL(event.origin).hostname}catch{return}
 if(host!=="script.google.com"&&!host.endsWith(".googleusercontent.com"))return;
 const result=event.data;
 if(result?.type!=="gcp-rsvp"||typeof result.nonce!=="string")return;
 const pending=planningPendingResponses.get(result.nonce);
 if(!pending)return;
 planningPendingResponses.delete(result.nonce);
 clearTimeout(pending.timeout);
 pending.form.querySelectorAll("button").forEach(button=>button.disabled=false);
 pending.status.textContent=result.ok?"Je reactie is opgeslagen.":`Opslaan is niet gelukt: ${result.message||"probeer het opnieuw."}`;
 if(result.ok&&pending.containerId)setTimeout(()=>loadPlanningEvents(pending.competitionId,pending.containerId,pending.upcomingOnly),350);
});
function competities(){return `<div class="wrap page"><h1>Competities</h1><p style="color:var(--mute)">Lopende, aankomende en afgelopen competities. Oude standen blijven altijd beschikbaar.</p><div class="tiles" style="margin-top:20px">${COMPETITIES.map(tile).join("")}</div></div>`}
function cupIcon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0V4Z"/><path d="M8 6H5v2a4 4 0 0 0 4 4m7-6h3v2a4 4 0 0 1-4 4m-3 1v4m-4 3h8m-6-3h4"/></svg>'}
function roundAwardMarkup(score,pointKey="points",placeKey="place"){

 return `<span class="round-award"><span>${score[pointKey]??"–"}</span>${award}</span>`;
}
function flameIcon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a7 7 0 0 0 7-7c0-3-2-5.4-4.6-8.1.1 2.3-.7 3.8-1.7 4.8C12.4 7.2 10 3.6 7 2 7.6 6.6 5 8.9 5 14a7 7 0 0 0 7 8Z"/><path d="M12 22a3.5 3.5 0 0 0 3.5-3.5c0-1.5-.9-2.7-2.1-4-.1 1.2-.6 2-1.4 2.5-.2-1.7-1-2.8-2-3.5.2 2.2-1.5 3-1.5 5A3.5 3.5 0 0 0 12 22Z"/></svg>'}
function standChoices(){
 const competitions=COMPETITIES.filter(c=>c.sheetName);
 return `<div class="wrap page"><h1>Stand</h1><p style="color:var(--mute)">Kies een competitie</p><div class="stand-choices">${competitions.map(c=>`<a class="stand-choice" href="#/stand/${c.id}">${closeup(c.id)}<span>${escapeHtml(c.naam)}</span><b aria-hidden="true">→</b></a>`).join("")}</div></div>`;
}
function stand(id){
 if(!id)return standChoices();
 const c=COMPETITIES.find(x=>x.id===id&&x.sheetName); if(!c)return standChoices();
 const rounds=c.rondeScores||[];
 const bestStrokes=c.spelers.map((_,i)=>Math.min(...rounds.map(round=>round.scores[i]?.strokes).filter(strokes=>Number.isFinite(strokes)&&strokes>0),Infinity));
 const strokeTotalRanked=[...c.spelers].sort((a,b)=>a.t-b.t||b.p-a.p||a.n.localeCompare(b.n,"nl"));
 const strokeRanked=[...c.spelers].sort((a,b)=>b.p-a.p||a.t-b.t||a.n.localeCompare(b.n,"nl"));
 const stablefordRanked=[...c.spelers].filter(player=>player.stablefordRounds>0).sort((a,b)=>b.stablefordP-a.stablefordP||b.stableford-a.stableford||a.n.localeCompare(b.n,"nl"));
 const medals=["gold","silver","bronze"];
 const roundRows=rounds.map(round=>`<tr><th scope="row">${round.number}</th><td class="round-par">${round.par??"–"}</td>${round.scores.map((score,i)=>`<td class="round-score-cell${i===0?" group-start":""}${score.strokes===bestStrokes[i]?" best-round":""}"${score.strokes===bestStrokes[i]?` title="Laagste ronde van ${escapeHtml(c.spelers[i].n)}"`:""}><span class="round-score-content">${score.strokes===bestStrokes[i]?`<span class="round-flame">${flameIcon()}</span>`:""}<span class="round-score-value">${score.strokes??"–"}</span></span></td><td class="round-point"${Number.isFinite(score.strokes)?` aria-label="${score.points} ${score.points===1?"winpunt":"winpunten"}${score.place?`, plaats ${score.place}`:""}"`:""}>${roundAwardMarkup(score)}</td><td class="round-stableford">${score.stableford??"–"}</td><td class="round-point stableford-win-point"${Number.isFinite(score.stableford)?` aria-label="${score.stablefordPoint} ${score.stablefordPoint===1?"winpunt":"winpunten"} voor Stableford"`:""}>${roundAwardMarkup(score,"stablefordPoint","stablefordPlace")}</td>`).join("")}</tr>`).join("");
 const strokeTotalRows=strokeTotalRanked.map((player,index)=>`<tr class="${index?"":"first"}"><td><span class="rank-badge ${medals[index]||""}">${index+1}</span></td><td><a href="#/speler/${encodeURIComponent(player.n)}">${standPlayer(player.n)}</a></td><td>${player.t}</td><td>${player.strokeRounds?f1(player.t/player.strokeRounds):"–"}</td></tr>`).join("");
 const strokeStandingRows=strokeRanked.map((player,index)=>`<tr class="${index?"":"first"}"><td><span class="rank-badge ${medals[index]||""}">${index+1}</span></td><td><a href="#/speler/${encodeURIComponent(player.n)}">${standPlayer(player.n)}</a></td><td>${player.p}</td><td>${player.t}</td><td>${player.strokeRounds?f1(player.t/player.strokeRounds):"–"}</td></tr>`).join("");
 const stablefordStandingRows=stablefordRanked.map((player,index)=>`<tr class="${index?"":"first"}"><td><span class="rank-badge ${medals[index]||""}">${index+1}</span></td><td><a href="#/speler/${encodeURIComponent(player.n)}">${standPlayer(player.n)}</a></td><td>${player.stablefordP}</td><td>${player.stableford}</td><td>${player.stablefordRounds}</td></tr>`).join("");
 const totalCells=c.spelers.map((player,index)=>`<td${index===0?' class="group-start"':""}>${player.t||"–"}</td><td class="total-points">${player.p}</td><td class="total-stableford">${player.stablefordRounds?player.stableford:"–"}</td><td class="total-points">${player.stablefordP}</td>`).join("");
 const summary="Strokeplay: het klassement wordt bepaald door het laagste totaal aantal slagen, zonder handicap.";
 return `<div class="wrap page"><a class="back-to-stand" href="#/stand"><span aria-hidden="true">←</span> Andere competitie kiezen</a><h1>${c.naam}</h1><p style="color:var(--mute)">Gebaseerd op ${c.rondes} gespeelde rondes. ${summary}</p>
 <div class="sec"><div><h3>Aankomende wedstrijden</h3><small>Wedstrijden uit de planning voor deze competitie</small></div><hr><a href="#/planning/${c.id}">Planning →</a></div>
 <div id="competition-planning" data-planning-events aria-live="polite"><div class="empty planning-empty">Planning wordt geladen…</div></div>
 ${rounds.length?"":'<div class="empty">Er zijn nog geen score-rijen voor deze competitie in het tabblad Scores.</div>'}
 <div class="sec"><div><h3>Strokeplay · totaal slagen</h3><small>Laagste totaal aantal slagen staat bovenaan</small></div><hr></div>
 <div class="stand-summary"><table><thead><tr><th scope="col">#</th><th scope="col">Speler</th><th scope="col">Totaal slagen</th><th scope="col">Gem. slagen</th></tr></thead><tbody>${strokeTotalRows}</tbody></table></div>
 <div class="sec"><div><h3>Strokeplay-klassement</h3><small>Iedereen met de minste slagen in een ronde krijgt 1 winpunt; gelijkspel telt voor alle winnaars.</small></div><hr></div>
 <div class="stand-summary"><table><thead><tr><th scope="col">#</th><th scope="col">Speler</th><th scope="col">Strokeplay-winpunten</th><th scope="col">Totaal slagen</th><th scope="col">Gem. slagen</th></tr></thead><tbody>${strokeStandingRows}</tbody></table></div>
 <div class="sec"><div><h3>Stableford-klassement</h3><small>Iedereen met de meeste Stableford-punten in een ronde krijgt 1 winpunt; gelijkspel telt voor alle winnaars.</small></div><hr></div>
 ${stablefordRanked.length?`<div class="stand-summary"><table><thead><tr><th scope="col">#</th><th scope="col">Speler</th><th scope="col">Stableford-winpunten</th><th scope="col">Totaal Stableford</th><th scope="col">Ingevulde rondes</th></tr></thead><tbody>${stablefordStandingRows}</tbody></table></div>`:`<div class="empty">Er zijn nog geen Stableford-punten ingevuld in het tabblad Scores.</div>`}
 <div class="sec"><div><h3>Speelrondes</h3><small>Ronde-PAR, slagen, strokeplay-winpunten, Stableford-score en Stableford-winpunten</small></div><hr></div>
 <div class="round-table-wrap"><table class="round-table"><colgroup><col style="width:58px"><col style="width:58px">${c.spelers.map(()=>'<col style="width:76px"><col style="width:56px"><col style="width:92px"><col style="width:56px">').join("")}</colgroup><thead><tr><th rowspan="2" scope="col">Ronde</th><th rowspan="2" scope="col">Par</th>${c.spelers.map(s=>`<th colspan="4" scope="colgroup">${escapeHtml(playerProfileFor(s.n).icon||"⛳")} ${escapeHtml(playerProfileFor(s.n).name||s.n)}</th>`).join("")}</tr><tr>${c.spelers.map((_,i)=>`<th class="${i===0?"group-start":""}" scope="col">Slagen</th><th scope="col" title="Strokeplay-punt" aria-label="Strokeplay-punt">SP</th><th scope="col">Stableford</th><th scope="col" title="Stableford-punt" aria-label="Stableford-punt">SF</th>`).join("")}</tr></thead><tbody>${roundRows}</tbody><tfoot><tr><th scope="row" colspan="2">Totaal</th>${totalCells}</tr></tfoot></table></div>
 <div class="sec"><div><h3>Strokeplay-winstpunten per ronde</h3><small>Opgetelde winpunten na elke speelronde</small></div><hr></div>
 ${pointsChart(c,"points","Opgetelde Strokeplay-winpunten")}
 <div class="sec"><div><h3>Stableford-winstpunten per ronde</h3><small>Opgetelde winpunten na elke speelronde</small></div><hr></div>
 ${pointsChart(c,"stablefordPoint","Opgetelde Stableford-winpunten")}</div>`;
}
function spelers(){
 if(!playerProfilesLoaded&&!COMPETITIES.some(competition=>competition.rondeScores?.length))return `<div class="wrap page"><h1>Spelers</h1><div class="empty">Spelers worden geladen…</div></div>`;
 const playersByName=new Map();
 playerProfiles.forEach(profile=>{
  const scoreName=profile.scoreName||profile.name;
  if(scoreName)playersByName.set(scoreName.trim().toLocaleLowerCase("nl-NL"),{name:profile.name||scoreName,scoreName,profile,competitions:[]});
 });
 COMPETITIES.forEach(competition=>(competition.spelers||[]).forEach(player=>{
  const key=player.n.trim().toLocaleLowerCase("nl-NL");
  if(!key)return;
  if(!playersByName.has(key))playersByName.set(key,{name:player.n,scoreName:player.n,profile:playerProfileFor(player.n),competitions:[]});
  const entry=playersByName.get(key);
  if(entry.profile.name===entry.scoreName)entry.name=player.n;
  if(!entry.competitions.some(item=>item.id===competition.id))entry.competitions.push(competition);
 }));
 const players=[...playersByName.values()].sort((a,b)=>a.name.localeCompare(b.name,"nl"));
 if(!players.length)return `<div class="wrap page"><h1>Spelers</h1>${playerProfilesError?`<div class="data-notice" role="alert">${escapeHtml(playerProfilesError)}</div>`:""}<div class="empty">Er zijn nog geen spelers beschikbaar. Voeg spelers toe aan het tabblad Spelers in de Google Sheet.</div></div>`;
 return `<div class="wrap page"><h1>Spelers</h1><p style="color:var(--mute)">Spelernamen, golf-iconen en handicaps worden beheerd in het tabblad Spelers van de Google Sheet.</p>${playerProfilesError?`<div class="data-notice" role="alert">${escapeHtml(playerProfilesError)}</div>`:""}<div class="cards">${players.map(player=>{
  const profile=player.profile,handicap=profile.handicap===null?"Niet ingevuld":profile.handicap.toLocaleString("nl-NL",{maximumFractionDigits:1});
  const playedCompetitions=countPlayedCompetitions(player.scoreName);
   const stats=playerRoundStats(player.scoreName);
   const averageStrokes=stats.averageStrokes===null?"–":stats.averageStrokes.toLocaleString("nl-NL",{minimumFractionDigits:1,maximumFractionDigits:1});
   const averageToPar=stats.averageToPar===null?"–":formatToPar(stats.averageToPar);
   return `<a class="sc" href="#/speler/${encodeURIComponent(player.scoreName)}" aria-label="Bekijk het profiel van ${escapeHtml(player.name)}"><div class="player-card-head"><span class="player-avatar" aria-hidden="true">${escapeHtml(profile.icon)}</span><h4>${escapeHtml(player.name)}</h4></div><dl><dt>Handicap</dt><dd>${handicap}</dd><dt>Gespeelde competities</dt><dd>${playedCompetitions}</dd><dt>Gespeelde rondes</dt><dd class="player-card-rounds">${stats.totalRounds}</dd></dl><div class="player-card-stats"><div class="player-card-stat"><small>Gem. slagen · ${escapeHtml(stats.competition?.naam||"huidige competitie")}</small><b>${averageStrokes}</b></div><div class="player-card-stat"><small>Gem. t.o.v. par</small><b>${averageToPar}</b></div>${playerTrendMarkup(stats)}</div><span class="player-link">Bekijk profiel en scoregeschiedenis →</span></a>`;
 }).join("")}</div></div>`;
}
function speler(id){
 let requestedName=id;
 try{requestedName=decodeURIComponent(id)}catch{}
 const normalized=requestedName.trim().toLocaleLowerCase("nl-NL");
 const profile=playerProfiles.find(item=>(item.scoreName||item.name).toLocaleLowerCase("nl-NL")===normalized);
 const scorePlayer=COMPETITIES.flatMap(c=>c.spelers).find(s=>s.n.trim().toLocaleLowerCase("nl-NL")===normalized);
 const scoreName=profile?.scoreName||profile?.name||scorePlayer?.n;
 const playerName=profile?.name||scoreName;
 if(!playerName)return `<div class="wrap page"><h1>Speler niet gevonden</h1><div class="empty">Deze speler staat niet in de huidige competitie.</div><p><a href="#/spelers">← Terug naar spelers</a></p></div>`;
 const playerProfile=profile||playerProfileFor(scoreName);
 const competitions=COMPETITIES.map(c=>({competition:c,index:c.spelers.findIndex(s=>s.n.trim().toLocaleLowerCase("nl-NL")===(scoreName||"").trim().toLocaleLowerCase("nl-NL"))})).filter(({competition,index})=>index>=0&&(competition.rondeScores||[]).some(round=>round.scores[index]?.strokes!=null||round.scores[index]?.points!=null));
 const rows=competitions.flatMap(({competition,index})=>{const played=(competition.rondeScores||[]).filter(round=>round.scores[index]?.strokes!=null||round.scores[index]?.stableford!=null);const bestStrokes=Math.min(...played.map(round=>round.scores[index]?.strokes).filter(strokes=>Number.isFinite(strokes)&&strokes>0),Infinity);return played.map(round=>{const score=round.scores[index],strokes=score.strokes,best=strokes===bestStrokes;const toPar=Number.isFinite(strokes)&&Number.isFinite(round.par)?formatToPar(strokes-round.par):"NTB";return `<tr><td><a href="#/stand/${competition.id}">${escapeHtml(competition.naam)}</a></td><td>${round.number}</td><td${best?' class="best-round" title="Beste ronde van deze competitie"':""}>${strokes??"–"}${best?flameIcon():""}</td><td>${toPar}</td><td>${score.points??"–"}</td><td>${score.stableford??"–"}</td><td>${score.stablefordPoint??"–"}</td></tr>`})}).join("");
 const handicap=playerProfile.handicap===null?"Handicap nog niet ingevuld":`Handicap ${playerProfile.handicap.toLocaleString("nl-NL",{maximumFractionDigits:1})}`;
 return `<div class="wrap page"><p><a href="#/spelers">← Terug naar spelers</a></p><div class="player-profile"><span class="player-avatar" aria-hidden="true">${escapeHtml(playerProfile.icon)}</span><div><h1>${escapeHtml(playerName)}</h1><p>${handicap}</p></div></div><p style="color:var(--mute)">Alle geregistreerde wedstrijdscores en de bijbehorende competities.</p>${rows?`<div class="scroll player-scores"><table><thead><tr><th>Competitie</th><th>Ronde</th><th>Slagen</th><th>+/- PAR</th><th>Strokeplay-punt</th><th>Stableford</th><th>Stableford-punt</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">Er zijn nog geen ronde-uitslagen beschikbaar voor deze speler.</div>`}</div>`;
}
function toernooien(){return `<div class="wrap page"><h1>Toernooien</h1><p style="color:var(--mute)">Binnenkort meer nieuws over het volgende golftoernooi.</p><div class="tiles" style="margin-top:20px">${tournamentTile()}</div></div>`}

const NAV=[["","Home"],["competities","Competities"],["planning","Planning"],["stand","Stand"],["spelers","Spelers"],["toernooien","Toernooien"]];
function route(){
 const [hashPath,hashQuery=""]=(location.hash||"#/").slice(1).split("?");
 const [,p="",id]=(hashPath||"/").split("/");
 const eventId=new URLSearchParams(hashQuery).get("wedstrijd")||"";
 $("#nav").innerHTML=NAV.map(([k,t])=>`<a href="#/${k}" class="${k===p?"on":""}">${t}</a>`).join("");
 $("#app").innerHTML=({"":home,competities,planning:()=>planning(id,eventId),stand:()=>stand(id),spelers,speler:()=>speler(id),toernooien}[p]||home)();
 if(p==="planning")loadPlanningEvents(id);
 if(p==="stand"&&id)loadPlanningEvents(id,"competition-planning",true);
 let neededScores=[];
 if(!p){
  neededScores=COMPETITIES.filter(competition=>competition.status==="live"&&competition.sheetName);
 }else if(p==="competities"||p==="spelers"||p==="speler"){
  neededScores=COMPETITIES.filter(competition=>competition.sheetName);
 }else if(p==="stand"&&id){
  const competition=COMPETITIES.find(item=>item.id===id);
  if(competition?.sheetName)neededScores=[competition];
 }
 const pendingScores=neededScores.filter(competition=>!scoreRequests.has(competition.id));
 if(pendingScores.length){
  pendingScores.forEach(competition=>scoreRequests.add(competition.id));
  Promise.all(pendingScores.map(loadScores)).then(route);
 }
 const notice=scoresNotice();if(notice)$("#app").insertAdjacentHTML("afterbegin",`<div class="wrap">${notice}</div>`);
 window.scrollTo(0,0);
}
addEventListener("hashchange",route);route();loadSheetPlayerProfiles();
</script>
